// ACHIEVEMENTS
// ============================================================
function checkAchievements() {
  const saved = Save.get().achievements;
  ACHIEVEMENTS.forEach(ach => {
    if (!saved[ach.id] && ach.condition()) {
      saved[ach.id] = Date.now();
      Save.update(d => d.achievements[ach.id] = Date.now());
      showAchievement(ach.name);
    }
  });
}

function showAchievement(name) {
  const popup = document.getElementById('achievementPopup');
  document.getElementById('achName').textContent = name;
  popup.classList.add('show');
  setTimeout(() => popup.classList.remove('show'), 3500);
}

// ============================================================
// HUD UPDATES
// ============================================================
function updateHUD() {
  const p = G.player;

  // HP Bar
  const hpPct = Math.max(0, p.hp / p.maxHp * 100);
  document.getElementById('hpBar').style.width = hpPct + '%';
  document.getElementById('hpText').textContent = `${Math.ceil(p.hp)}/${p.maxHp}`;

  // Shield
  const shPct = p.maxShield > 0 ? (p.shield / p.maxShield * 100) : 0;
  document.getElementById('shieldBar').style.width = shPct + '%';

  // Low HP warning
  const lwarn = document.getElementById('lowHpWarning');
  lwarn.classList.toggle('active', hpPct < 30);

  // EXP Bar
  const expPct = G.expNeeded > 0 ? (G.exp / G.expNeeded * 100) : 0;
  document.getElementById('expBar').style.width = expPct + '%';

  // Score
  document.getElementById('scoreDisplay').textContent = Util.formatNum(G.score);

  // Level
  document.getElementById('levelDisplay').textContent = G.level;

  // Kills
  document.getElementById('killsDisplay').textContent = '☠ ' + G.sessionKills;

  // Combo
  const comboEl = document.getElementById('comboDisplay');
  if (G.combo >= 5) {
    comboEl.textContent = `x${G.combo} COMBO`;
    const intensity = Math.min(G.combo / 30, 1);
    comboEl.style.fontSize = (0.75 + intensity * 0.5) + 'rem';
    comboEl.style.color = G.combo >= 20 ? '#ffcc00' : G.combo >= 10 ? '#ff8800' : '#00ffcc';
    comboEl.style.textShadow = `0 0 ${8 + intensity * 20}px currentColor`;
  } else {
    comboEl.textContent = '';
  }
}

// ============================================================
// SKILL SLOT UI
// ============================================================
function updateSkillSlotUI() {
  G.skills.forEach((skill, i) => {
    const slot = document.getElementById('skill' + i);
    if (!slot || !skill) return;
    slot.querySelector('.skill-icon').textContent = skill.icon;
    slot.querySelector('.skill-key').textContent = ['Q','E','R'][i];
  });
}

function updateSkillCooldowns(dt) {
  G.skillCooldowns = G.skillCooldowns.map((cd, i) => {
    const newCd = Math.max(0, cd - dt);
    const slot = document.getElementById('skill' + i);
    if (slot) {
      const pct = G.skills[i] ? (newCd / G.skills[i].cooldown * 100) : 0;
      slot.style.setProperty('--cooldown-pct', pct + '%');
      slot.classList.toggle('on-cooldown', pct > 0);
    }
    return newCd;
  });
}

function activateSkill(index) {
  if (!G.skills[index] || G.skillCooldowns[index] > 0 || G.paused) return;
  G.skills[index].activate(G.player);
  G.skillCooldowns[index] = G.skills[index].cooldown;
}

// ============================================================
// CAMERA
// ============================================================
function updateCamera() {
  const p = G.player;
  const targetX = p.x - G.W / 2;
  const targetY = p.y - G.H / 2;

  G.camX = Util.clamp(Util.lerp(G.camX, targetX, 0.12), 0, G.worldW - G.W);
  G.camY = Util.clamp(Util.lerp(G.camY, targetY, 0.12), 0, G.worldH - G.H);

  // Screen shake decay
  if (G.camShakePower > 0.1) {
    G.camShakeX = (Math.random() - 0.5) * G.camShakePower * 2;
    G.camShakeY = (Math.random() - 0.5) * G.camShakePower * 2;
    G.camShakePower *= 0.85;
  } else {
    G.camShakePower = 0;
    G.camShakeX = 0;
    G.camShakeY = 0;
  }
}

// ============================================================
// INPUT HANDLING
// ============================================================
function initInput() {
  // Keyboard
  window.addEventListener('keydown', e => {
    G.keys[e.code] = true;

    if (!G.running) return;

    if (e.code === 'Escape' || e.code === 'KeyP') {
      togglePause();
    }
    if (e.code === 'KeyQ') activateSkill(0);
    if (e.code === 'KeyE') activateSkill(1);
    if (e.code === 'KeyR') activateSkill(2);

    if ((e.code === 'KeyM' || e.code === 'KeyL') && G.keys['KeyM'] && G.keys['KeyL'] && !G.adminToggleHeld) {
      G.adminToggleHeld = true;
      toggleAdminPanel();
    }
  });

  window.addEventListener('keyup', e => {
    G.keys[e.code] = false;
    if (e.code === 'KeyM' || e.code === 'KeyL') {
      G.adminToggleHeld = false;
    }
  });

  // Mouse
  canvas.addEventListener('mousemove', e => {
    G.mouse.x = e.clientX;
    G.mouse.y = e.clientY;
  });

  canvas.addEventListener('mousedown', e => {
    G.mouse.down = true;
    Audio.init();
    Audio.resume();
  });

  canvas.addEventListener('mouseup', () => G.mouse.down = false);

  // Touch controls for joystick
  initJoystick();

  // Mobile action button
  document.getElementById('mobileActionBtn').addEventListener('touchstart', e => {
    e.preventDefault();
    Audio.init();
    Audio.resume();
    activateSkill(0);
  }, { passive: false });
}

// Joystick
function initJoystick() {
  const area = document.getElementById('joystickArea');
  const knob = document.getElementById('joystickKnob');
  const baseR = 40;

  // Only show on touch devices
  const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (!isTouchDevice) {
    area.style.display = 'none';
    document.getElementById('mobileActionBtn').style.display = 'none';
    return;
  }

  let startX, startY;

  area.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    G.joystick.active = true;
    G.joystick.id = t.identifier;
    const rect = area.getBoundingClientRect();
    startX = rect.left + rect.width / 2;
    startY = rect.top + rect.height / 2;
    Audio.init();
    Audio.resume();
  }, { passive: false });

  window.addEventListener('touchmove', e => {
    e.preventDefault();
    Array.from(e.changedTouches).forEach(t => {
      if (t.identifier === G.joystick.id) {
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const clamped = Math.min(dist, baseR);
        const angle = Math.atan2(dy, dx);
        G.joystick.dx = (clamped / baseR) * Math.cos(angle);
        G.joystick.dy = (clamped / baseR) * Math.sin(angle);
        // Move knob
        knob.style.transform = `translate(${Math.cos(angle)*clamped}px, ${Math.sin(angle)*clamped}px)`;
      }
    });
  }, { passive: false });

  window.addEventListener('touchend', e => {
    Array.from(e.changedTouches).forEach(t => {
      if (t.identifier === G.joystick.id) {
        G.joystick.active = false;
        G.joystick.dx = 0;
        G.joystick.dy = 0;
        knob.style.transform = 'translate(0,0)';
      }
    });
  }, { passive: false });

  // Second finger for aiming / shooting
  window.addEventListener('touchstart', e => {
    Array.from(e.changedTouches).forEach(t => {
      const area = document.getElementById('joystickArea');
      const rect = area.getBoundingClientRect();
      const isOnJoystick = t.clientX >= rect.left && t.clientX <= rect.right && t.clientY >= rect.top && t.clientY <= rect.bottom;
      if (!isOnJoystick && t.identifier !== G.joystick.id) {
        G.mouse.x = t.clientX;
        G.mouse.y = t.clientY;
        G.mouse.down = true;
      }
    });
  }, { passive: false });

  window.addEventListener('touchend', e => {
    Array.from(e.changedTouches).forEach(t => {
      if (t.identifier !== G.joystick.id) {
        G.mouse.down = false;
      }
    });
  }, { passive: false });
}

// ============================================================
// PLAYER MOVEMENT & SHOOTING
// ============================================================
function updatePlayer(dt) {
  const p = G.player;

  // Direction input
  let dx = 0, dy = 0;

  if (G.keys['KeyW'] || G.keys['ArrowUp']) dy -= 1;
  if (G.keys['KeyS'] || G.keys['ArrowDown']) dy += 1;
  if (G.keys['KeyA'] || G.keys['ArrowLeft']) dx -= 1;
  if (G.keys['KeyD'] || G.keys['ArrowRight']) dx += 1;

  if (G.joystick.active) {
    dx = G.joystick.dx;
    dy = G.joystick.dy;
  }

  // Normalize
  const dlen = Math.sqrt(dx*dx + dy*dy);
  if (dlen > 0) { dx /= dlen; dy /= dlen; }

  // Apply movement
  p.vx = Util.lerp(p.vx, dx * p.speed, 0.25);
  p.vy = Util.lerp(p.vy, dy * p.speed, 0.25);

  p.x += p.vx * dt;
  p.y += p.vy * dt;

  // World bounds
  p.x = Util.clamp(p.x, p.r, G.worldW - p.r);
  p.y = Util.clamp(p.y, p.r, G.worldH - p.r);

  // Aim toward nearest enemy
  let nearest = null, nearDist = Infinity;
  G.enemies.forEach(e => {
    if (e.dead) return;
    const dist = Util.dist(p, e);
    if (dist < nearDist) { nearDist = dist; nearest = e; }
  });
  if (G.boss && !G.boss.dead) {
    const dist = Util.dist(p, G.boss);
    if (dist < nearDist) { nearest = G.boss; }
  }
  if (nearest) {
    p.angle = Util.angle(p, nearest);
  }

  // Auto shoot
  G.shootTimer -= dt * G.timeScale;
  if (G.shootTimer <= 0) {
    G.shootTimer = G.shootInterval;
    shootPlayer();
  }

  // Invincibility
  if (p.invincible > 0) p.invincible -= dt;

  // HP regen
  if (p.regen > 0) {
    p.hp = Math.min(p.maxHp, p.hp + p.regen * dt);
  }

  // Trail
  p.trail.push({ x: p.x, y: p.y, r: p.r, t: 1 });
  if (p.trail.length > 8) p.trail.shift();
  p.trail.forEach(tp => tp.t -= dt * 4);

  // Orbital turrets
  if (p.orbitals && p.orbitals.length > 0) {
    p.orbitalTimer += dt;
    p.orbitals.forEach((orb, i) => {
      orb.a += dt * 1.5;
      if (p.orbitalTimer > 0.8) {
        const ox = p.x + Math.cos(orb.a) * 60;
        const oy = p.y + Math.sin(orb.a) * 60;
        // Find nearest enemy
        let nearest = null, nearDist = Infinity;
        G.enemies.forEach(e => {
          const d = Util.dist({x:ox,y:oy}, e);
          if (d < nearDist) { nearDist = d; nearest = e; }
        });
        if (G.boss) {
          const d = Util.dist({x:ox,y:oy}, G.boss);
          if (d < nearDist) { nearest = G.boss; }
        }
        if (nearest) {
          const a = Util.angle({x:ox,y:oy}, nearest);
          G.bullets.push(createBullet(ox, oy, a, p.bulletSpeed * 0.7, p.damage * 0.6, true, '#00ff88'));
        }
      }
    });
    if (p.orbitalTimer > 0.8) p.orbitalTimer = 0;
  }

  // Aura visual
  if (p.aura) {
    p.auraTimer += dt;
    if (p.auraTimer > 0.5) {
      p.auraTimer = 0;
      // Deal aura damage
      G.enemies.forEach(e => {
        if (Util.dist(p, e) < 80) dealDamage(e, p.damage * 0.3, false, p.x, p.y);
      });
      if (G.boss && Util.dist(p, G.boss) < 100) dealDamage(G.boss, p.damage * 0.3, false, p.x, p.y);
    }
  }

  // Combo decay
  if (G.combo > 0) {
    G.comboTimer -= dt;
    if (G.comboTimer <= 0) {
      G.combo = 0;
      updateHUD();
    }
  }

  p.pulseTimer += dt;
  updateHUD();
}

function shootPlayer() {
  const p = G.player;
  const count = p.bulletCount;
  const baseAngle = p.angle;
  const spread = p.bulletSpread;

  Audio.sounds.shoot();

  for (let i = 0; i < count; i++) {
    const offset = count === 1 ? 0 : (i / (count - 1) - 0.5) * spread;
    const angle = baseAngle + offset;
    const b = createBullet(p.x, p.y, angle, p.bulletSpeed, p.damage, true);

    // Crit check
    if (Math.random() < p.critChance) {
      b.damage *= p.critMult;
      b.isCrit = true;
      b.r = 7;
      b.color = '#ffcc00';
    }

    // Homing
    if (p.homing) {
      b.homing = true;
    }

    G.bullets.push(b);
  }

  // Muzzle flash particle
  spawnParticle(p.x + Math.cos(p.angle) * p.r, p.y + Math.sin(p.angle) * p.r, {
    color: '#ffffff',
    r: 5,
    speed: 50,
    life: 0.1,
  });
}

// ============================================================
// ENEMY AI UPDATE
// ============================================================
function updateEnemy(e, dt) {
  if (e.dead) return;
  if (e.stunned > 0) { e.stunned -= dt; return; }

  const p = G.player;
  const dist = Util.dist(e, p);

  // AI behavior
  e.aiTimer += dt;

  // Chase player
  const angle = Util.angle(e, p);

  let speedMult = 1;
  if (e.slowed > 0) { speedMult = 0.4; e.slowed -= dt; }

  // Different AI per type
  if (e.type === 'sniper') {
    // Sniper: keep distance, aim carefully
    if (dist > 250) {
      e.vx = Util.lerp(e.vx, Math.cos(angle) * e.speed * speedMult, 0.05);
      e.vy = Util.lerp(e.vy, Math.sin(angle) * e.speed * speedMult, 0.05);
    } else if (dist < 150) {
      e.vx = Util.lerp(e.vx, -Math.cos(angle) * e.speed * 0.5, 0.05);
      e.vy = Util.lerp(e.vy, -Math.sin(angle) * e.speed * 0.5, 0.05);
    } else {
      e.vx *= 0.9;
      e.vy *= 0.9;
    }
  } else if (e.type === 'heavy') {
    // Heavy: slow, steady approach, occasional charge
    if (e.aiTimer > 4) {
      e.aiTimer = 0;
      e.aiState = e.aiState === 'charge' ? 'chase' : 'charge';
    }
    const sp = e.aiState === 'charge' ? e.speed * 2 : e.speed;
    e.vx = Util.lerp(e.vx, Math.cos(angle) * sp * speedMult, 0.03);
    e.vy = Util.lerp(e.vy, Math.sin(angle) * sp * speedMult, 0.03);
  } else if (e.type === 'swarm') {
    // Swarm: erratic movement
    const jitter = e.aiTimer * 5;
    const jAngle = angle + Math.sin(jitter) * 1.2;
    e.vx = Util.lerp(e.vx, Math.cos(jAngle) * e.speed * speedMult, 0.12);
    e.vy = Util.lerp(e.vy, Math.sin(jAngle) * e.speed * speedMult, 0.12);
  } else {
    // Basic / fast / elite: direct chase
    e.vx = Util.lerp(e.vx, Math.cos(angle) * e.speed * speedMult, 0.1);
    e.vy = Util.lerp(e.vy, Math.sin(angle) * e.speed * speedMult, 0.1);
  }

  e.x += e.vx * dt;
  e.y += e.vy * dt;
  e.x = Util.clamp(e.x, e.r, G.worldW - e.r);
  e.y = Util.clamp(e.y, e.r, G.worldH - e.r);
  e.angle = angle;

  // Shoot
  if (e.shoot) {
    e.shootTimer -= dt;
    if (e.shootTimer <= 0) {
      e.shootTimer = e.shootRate * (0.8 + Math.random() * 0.4);
      if (e.type === 'sniper') {
        // Accurate single shot
        const a = Util.angle(e, p);
        G.enemyBullets.push(createBullet(e.x, e.y, a, 320, e.damage, false));
      } else if (e.type === 'heavy') {
        // Spread shot
        for (let i = 0; i < 5; i++) {
          const a = Util.angle(e, p) + (i - 2) * 0.25;
          G.enemyBullets.push(createBullet(e.x, e.y, a, 200, e.damage * 0.6, false));
        }
      } else {
        // Normal shot
        const a = Util.angle(e, p);
        G.enemyBullets.push(createBullet(e.x, e.y, a, 220, e.damage, false));
      }
      Audio.sounds.shoot();
    }
  }

  // Collision with player
  if (dist < e.r + p.r) {
    dealPlayerDamage(e.damage * dt * 3);
  }

  // Visual
  e.flashTimer = Math.max(0, e.flashTimer - dt);
  e.glowIntensity = Util.lerp(e.glowIntensity, 0.5 + (1 - e.hp/e.maxHp) * 0.5, 0.1);
}

// ============================================================
// BOSS AI UPDATE
// ============================================================
function updateBoss(boss, dt) {
  if (boss.dead) return;
  const p = G.player;

  boss.angle += boss.rotSpeed * dt;
  boss.haloAngle += dt * 0.5;
  boss.patternTimer += dt;
  boss.flashTimer = Math.max(0, boss.flashTimer - dt);

  // Enrage at 30% HP
  if (boss.hp < boss.maxHp * 0.3 && !boss.enraged) {
    boss.enraged = true;
    boss.rotSpeed *= 2;
    boss.shootRate *= 0.5;
    showToast('⚠ BOSS ENRAGED!');
    screenShake(20, 0.5);
    Audio.sounds.bossWarn();
  }

  // Movement
  const dist = Util.dist(boss, p);
  const angle = Util.angle(boss, p);

  if (dist > 300) {
    boss.vx = Util.lerp(boss.vx, Math.cos(angle) * boss.speed, 0.03);
    boss.vy = Util.lerp(boss.vy, Math.sin(angle) * boss.speed, 0.03);
  } else if (dist < 150) {
    boss.vx = Util.lerp(boss.vx, -Math.cos(angle) * boss.speed * 0.5, 0.03);
    boss.vy = Util.lerp(boss.vy, -Math.sin(angle) * boss.speed * 0.5, 0.03);
  } else {
    boss.vx = Util.lerp(boss.vx, Math.sin(boss.angle) * boss.speed * 0.5, 0.05);
    boss.vy = Util.lerp(boss.vy, -Math.cos(boss.angle) * boss.speed * 0.5, 0.05);
  }

  boss.x += boss.vx * dt;
  boss.y += boss.vy * dt;
  boss.x = Util.clamp(boss.x, boss.r, G.worldW - boss.r);
  boss.y = Util.clamp(boss.y, boss.r, G.worldH - boss.r);

  // Attack patterns
  boss.shootTimer -= dt;

  if (boss.patternTimer > boss.patternDuration) {
    boss.patternTimer = 0;
    boss.pattern = (boss.pattern + 1) % 4;
  }

  if (boss.shootTimer <= 0) {
    boss.shootTimer = boss.shootRate;

    const mult = boss.enraged ? 2 : 1;

    switch (boss.pattern) {
      case 0: // Radial burst
        for (let i = 0; i < 12 * mult; i++) {
          const a = boss.angle + (i / (12 * mult)) * Math.PI * 2;
          G.enemyBullets.push(createBullet(boss.x, boss.y, a, 200, boss.damage * 0.5, false, '#ff0080'));
        }
        break;
      case 1: // Aimed spread
        for (let i = 0; i < 5; i++) {
          const a = angle + (i - 2) * 0.2;
          G.enemyBullets.push(createBullet(boss.x, boss.y, a, 280, boss.damage * 0.7, false, '#ff4400'));
        }
        break;
      case 2: // Spiral
        for (let i = 0; i < 3; i++) {
          const a = boss.haloAngle + (i / 3) * Math.PI * 2;
          G.enemyBullets.push(createBullet(boss.x, boss.y, a, 240, boss.damage * 0.6, false, '#ff00ff'));
        }
        boss.haloAngle += 0.3;
        break;
      case 3: // Chaos
        for (let i = 0; i < 8; i++) {
          const a = Math.random() * Math.PI * 2;
          G.enemyBullets.push(createBullet(boss.x, boss.y, a, 180 + Math.random() * 120, boss.damage * 0.4, false, '#cc00ff'));
        }
        break;
    }
    Audio.sounds.shoot();
  }

  // Contact damage
  if (dist < boss.r + p.r) {
    dealPlayerDamage(boss.damage * dt * 2);
  }

  // Tentacle wave update
  boss.tentacles.forEach((t, i) => {
    t.wave = Math.sin(boss.angle * 2 + i * 1.2) * 20;
  });

  // Dead?
  if (boss.hp <= 0) killBoss(boss);
}

// ============================================================
// BULLET UPDATE
// ============================================================
function updateBullets(dt) {
  // Player bullets
  G.bullets = G.bullets.filter(b => {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;

    // Homing
    if (b.homing && b.hitsLeft > 0) {
      let nearest = null, nearDist = Infinity;
      G.enemies.forEach(e => {
        const d = Util.dist(b, e);
        if (d < nearDist) { nearDist = d; nearest = e; }
      });
      if (G.boss && Util.dist(b, G.boss) < nearDist) nearest = G.boss;
      if (nearest && nearDist < 300) {
        const a = Util.angle(b, nearest);
        const turnSpeed = 4;
        b.vx = Util.lerp(b.vx, Math.cos(a) * b.speed, turnSpeed * dt);
        b.vy = Util.lerp(b.vy, Math.sin(a) * b.speed, turnSpeed * dt);
      }
    }

    if (b.life <= 0 || b.x < -50 || b.x > G.worldW+50 || b.y < -50 || b.y > G.worldH+50) return false;

    // Hit enemies
    let hit = false;
    G.enemies.forEach(e => {
      if (e.dead || b.hitsLeft <= 0) return;
      if (Util.dist(b, e) < b.r + e.r) {
        dealDamage(e, b.damage, b.isCrit, b.x, b.y);
        b.hitsLeft--;
        Audio.sounds.hit();
        spawnParticle(b.x, b.y, { color: b.color, r: 4, speed: 80, life: 0.2 });
        if (b.hitsLeft <= 0) hit = true;
      }
    });

    // Hit boss
    if (G.boss && !G.boss.dead && b.hitsLeft > 0) {
      if (Util.dist(b, G.boss) < b.r + G.boss.r) {
        dealDamage(G.boss, b.damage, b.isCrit, b.x, b.y);
        G.boss.flashTimer = 0.1;
        b.hitsLeft--;
        Audio.sounds.hit();
        spawnParticle(b.x, b.y, { color: '#ff0040', r: 5, speed: 100, life: 0.3 });
        if (b.hitsLeft <= 0) hit = true;
      }
    }

    // Trail particle
    if (Math.random() < 0.3 && G.settings.particles) {
      spawnParticle(b.x, b.y, { color: b.color, r: b.r * 0.5, speed: 20, life: 0.15 });
    }

    return b.life > 0 && b.hitsLeft > 0;
  });

  // Enemy bullets
  G.enemyBullets = G.enemyBullets.filter(b => {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;

    if (b.life <= 0 || b.x < -50 || b.x > G.worldW+50 || b.y < -50 || b.y > G.worldH+50) return false;

    // Hit player
    if (Util.dist(b, G.player) < b.r + G.player.r) {
      dealPlayerDamage(b.damage);
      spawnParticle(b.x, b.y, { color: '#ff0040', r: 6, speed: 100, life: 0.2 });
      return false;
    }

    return true;
  });
}

// ============================================================
// COLLECTIBLES
// ============================================================
function updateCollectibles(dt) {
  const p = G.player;

  G.collectibles = G.collectibles.filter(c => {
    if (c.collected) return false;
    c.life -= dt;
    if (c.life <= 0) return false;

    c.pulse += dt * 3;

    // Move with inertia
    c.vx *= 0.92;
    c.vy *= 0.92;
    c.x += c.vx * dt;
    c.y += c.vy * dt;

    // Magnet to player
    const dist = Util.dist(c, p);
    if (dist < p.magnetRange) {
      const a = Util.angle(c, p);
      c.vx += Math.cos(a) * 400 * dt;
      c.vy += Math.sin(a) * 400 * dt;
    }

    // Collect
    if (dist < p.r + c.r + 5) {
      c.collected = true;
      if (c.type === 'xp') {
        gainExp(Math.round(10 * G.player.expMult));
        Audio.sounds.collect();
      } else if (c.type === 'hp') {
        G.player.hp = Math.min(G.player.maxHp, G.player.hp + 20);
        showToast('+20 HP');
        Audio.sounds.shield();
      }
      spawnParticle(c.x, c.y, {
        color: c.type === 'xp' ? '#bf00ff' : '#00ff88',
        r: 8, speed: 100, life: 0.3
      });
      return false;
    }

    return true;
  });
}

// ============================================================
// PARTICLES UPDATE
// ============================================================
function updateParticles(dt) {
  G.particles = G.particles.filter(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.gravity * dt;
    p.vx *= 0.98;
    p.vy *= 0.98;
    p.life -= dt;
    if (p.shrink) p.r *= (1 - dt * 2);
    return p.life > 0 && p.r > 0.3;
  });

  G.damageNumbers = G.damageNumbers.filter(dn => {
    dn.y += dn.vy * dt;
    dn.vy *= 0.95;
    dn.life -= dt;
    return dn.life > 0;
  });
}

// ============================================================
// WAVE LOGIC
// ============================================================
function updateWave(dt) {
  if (G.bossActive || G.boss) return;

  // Check if wave is complete
  if (G.enemies.length === 0 && G.waveEnemiesKilled >= G.waveEnemiesTotal) {
    G.wave++;
    startWave();
  }
}

// ============================================================
// MAIN RENDER LOOP
// ============================================================
function render() {
  const c = ctx2;
  const W = G.W, H = G.H;

  // Clear
  c.clearRect(0, 0, W, H);

  // Background
  c.fillStyle = '#050810';
  c.fillRect(0, 0, W, H);

  // Grid
  drawGrid(c);

  // World transform
  c.save();
  c.translate(-G.camX + G.camShakeX, -G.camY + G.camShakeY);

  // World border glow
  c.strokeStyle = 'rgba(0,245,255,0.15)';
  c.lineWidth = 3;
  c.strokeRect(0, 0, G.worldW, G.worldH);

  // Draw collectibles
  drawCollectibles(c);

  // Draw orbitals
  drawOrbitals(c);

  // Draw player trail
  drawPlayerTrail(c);

  // Draw enemies
  G.enemies.forEach(e => drawEnemy(c, e));

  // Draw boss
  if (G.boss && !G.boss.dead) drawBoss(c, G.boss);

  // Draw player
  drawPlayer(c, G.player);

  // Draw bullets
  drawBullets(c);

  // Draw particles
  drawParticles(c);

  // Draw damage numbers
  drawDamageNumbers(c);

  c.restore(); // End world transform

  // Screen effects
  drawScreenEffects(c, W, H);

  // Screen flash
  if (G.screenFlashAlpha > 0) {
    c.fillStyle = G.screenFlashColor + G.screenFlashAlpha + ')';
    c.fillRect(0, 0, W, H);
    G.screenFlashAlpha *= 0.8;
    if (G.screenFlashAlpha < 0.01) G.screenFlashAlpha = 0;
  }

  // Minimap
  drawMinimap();
}

// ============================================================
// DRAW FUNCTIONS
// ============================================================
function drawGrid(c) {
  const gridSize = 100;
  const offsetX = G.camX % gridSize;
  const offsetY = G.camY % gridSize;

  c.strokeStyle = 'rgba(0,245,255,0.04)';
  c.lineWidth = 1;

  for (let x = -offsetX; x < G.W + gridSize; x += gridSize) {
    c.beginPath();
    c.moveTo(x, 0);
    c.lineTo(x, G.H);
    c.stroke();
  }
  for (let y = -offsetY; y < G.H + gridSize; y += gridSize) {
    c.beginPath();
    c.moveTo(0, y);
    c.lineTo(G.W, y);
    c.stroke();
  }
}

function drawPlayer(c, p) {
  const x = p.x, y = p.y, r = p.r;
  const t = p.pulseTimer;

  // Aura ring
  if (p.aura) {
    c.beginPath();
    c.arc(x, y, 80, 0, Math.PI * 2);
    c.strokeStyle = `rgba(0,255,136,${0.1 + Math.sin(t*3) * 0.05})`;
    c.lineWidth = 3;
    c.stroke();
  }

  // Shield ring
  if (p.shield > 0) {
    const shPct = p.shield / Math.max(p.maxShield, 1);
    c.beginPath();
    c.arc(x, y, r + 8, 0, Math.PI * 2 * shPct);
    c.strokeStyle = `rgba(0,136,255,0.8)`;
    c.lineWidth = 3;
    c.stroke();
    // Shield glow
    c.beginPath();
    c.arc(x, y, r + 8, 0, Math.PI * 2);
    c.strokeStyle = 'rgba(0,136,255,0.15)';
    c.lineWidth = 8;
    c.stroke();
  }

  // Invincible flicker
  if (p.invincible > 0 && Math.floor(p.invincible * 10) % 2 === 0) return;

  // Body glow
  const grad = c.createRadialGradient(x, y, 0, x, y, r * 2);
  grad.addColorStop(0, 'rgba(0,245,255,0.3)');
  grad.addColorStop(1, 'rgba(0,245,255,0)');
  c.fillStyle = grad;
  c.beginPath();
  c.arc(x, y, r * 2.5, 0, Math.PI * 2);
  c.fill();

  // Player ship shape (triangle-ish)
  c.save();
  c.translate(x, y);
  c.rotate(p.angle);

  // Hull
  c.beginPath();
  c.moveTo(r, 0);
  c.lineTo(-r * 0.7, -r * 0.7);
  c.lineTo(-r * 0.4, 0);
  c.lineTo(-r * 0.7, r * 0.7);
  c.closePath();

  c.fillStyle = '#0a1832';
  c.fill();
  c.strokeStyle = '#00f5ff';
  c.lineWidth = 2.5;
  c.stroke();

  // Cockpit
  c.beginPath();
  c.arc(r * 0.3, 0, r * 0.25, 0, Math.PI * 2);
  c.fillStyle = `rgba(0,245,255,${0.6 + Math.sin(t * 4) * 0.3})`;
  c.fill();

  // Engine trails
  c.beginPath();
  c.moveTo(-r * 0.4, 0);
  c.lineTo(-r * (1 + Math.abs(p.vx + p.vy) / p.speed * 1.5), 0);
  c.strokeStyle = `rgba(0,245,255,${0.3 + Math.random() * 0.3})`;
  c.lineWidth = 3;
  c.stroke();

  c.restore();

  // Pulse ring
  const pulseFraction = (t % 1);
  if (pulseFraction < 0.5) {
    c.beginPath();
    c.arc(x, y, r + pulseFraction * 20, 0, Math.PI * 2);
    c.strokeStyle = `rgba(0,245,255,${0.2 - pulseFraction * 0.4})`;
    c.lineWidth = 1.5;
    c.stroke();
  }
}

function drawPlayerTrail(c) {
  G.player.trail.forEach((tp, i) => {
    if (tp.t <= 0) return;
    c.beginPath();
    c.arc(tp.x, tp.y, tp.r * tp.t * 0.5, 0, Math.PI * 2);
    c.fillStyle = `rgba(0,245,255,${tp.t * 0.15})`;
    c.fill();
  });
}

function drawOrbitals(c) {
  const p = G.player;
  if (!p.orbitals || p.orbitals.length === 0) return;
  p.orbitals.forEach(orb => {
    const ox = p.x + Math.cos(orb.a) * 60;
    const oy = p.y + Math.sin(orb.a) * 60;

    // Orbital glow
    c.beginPath();
    c.arc(ox, oy, 10, 0, Math.PI * 2);
    const og = c.createRadialGradient(ox, oy, 0, ox, oy, 12);
    og.addColorStop(0, 'rgba(0,255,136,0.9)');
    og.addColorStop(1, 'rgba(0,255,136,0)');
    c.fillStyle = og;
    c.fill();

    // Orbit ring (partial)
    c.beginPath();
    c.arc(p.x, p.y, 60, orb.a - 0.3, orb.a + 0.3);
    c.strokeStyle = 'rgba(0,255,136,0.15)';
    c.lineWidth = 1;
    c.stroke();
  });
}

function drawEnemy(c, e) {
  if (e.dead) return;
  const x = e.x, y = e.y, r = e.r;

  const flashIntensity = e.flashTimer > 0 ? 1 : 0;
  const hpPct = e.hp / e.maxHp;

  // Glow
  const glow = c.createRadialGradient(x, y, 0, x, y, r * 2.5);
  glow.addColorStop(0, e.color + '40');
  glow.addColorStop(1, 'transparent');
  c.fillStyle = glow;
  c.beginPath();
  c.arc(x, y, r * 2.5, 0, Math.PI * 2);
  c.fill();

  // Body
  c.save();
  c.translate(x, y);
  c.rotate(e.angle + G.frameCount * 0.02 * (e.type === 'heavy' ? 0.5 : 1));

  if (e.type === 'swarm') {
    // Diamond shape
    c.beginPath();
    c.moveTo(0, -r);
    c.lineTo(r, 0);
    c.lineTo(0, r);
    c.lineTo(-r, 0);
    c.closePath();
  } else if (e.type === 'sniper') {
    // Elongated hexagon
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const rx = Math.cos(a) * r * (i % 2 === 0 ? 1 : 0.7);
      const ry = Math.sin(a) * r * (i % 2 === 0 ? 1 : 0.7);
      i === 0 ? c.moveTo(rx, ry) : c.lineTo(rx, ry);
    }
    c.closePath();
  } else if (e.type === 'heavy') {
    // Octagon
    c.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      i === 0 ? c.moveTo(Math.cos(a)*r, Math.sin(a)*r) : c.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    c.closePath();
  } else {
    // Pentagon / default
    c.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
      i === 0 ? c.moveTo(Math.cos(a)*r, Math.sin(a)*r) : c.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    c.closePath();
  }

  c.fillStyle = flashIntensity > 0 ? '#ffffff' : '#0a0a1a';
  c.fill();
  c.strokeStyle = flashIntensity > 0 ? '#ffffff' : e.color;
  c.lineWidth = 2.5;
  c.stroke();

  // Inner core
  c.beginPath();
  c.arc(0, 0, r * 0.35, 0, Math.PI * 2);
  c.fillStyle = flashIntensity > 0 ? '#ffffff' : e.color;
  c.globalAlpha = 0.7;
  c.fill();
  c.globalAlpha = 1;

  c.restore();

  // HP bar (only show if damaged)
  if (hpPct < 1) {
    const bw = r * 2.5;
    const bh = 4;
    const bx = x - bw / 2;
    const by = y - r - 10;

    c.fillStyle = 'rgba(0,0,0,0.5)';
    c.fillRect(bx, by, bw, bh);
    c.fillStyle = hpPct > 0.5 ? e.color : '#ff0040';
    c.fillRect(bx, by, bw * hpPct, bh);
  }
}

function drawBoss(c, boss) {
  const x = boss.x, y = boss.y, r = boss.r;
  const t = G.frameCount * 0.02;
  const hpPct = boss.hp / boss.maxHp;
  const flashIntensity = boss.flashTimer > 0 ? 1 : 0;

  // Outer aura
  const auraSize = r * 3 + Math.sin(t * 2) * 10;
  const auraGrad = c.createRadialGradient(x, y, r, x, y, auraSize);
  auraGrad.addColorStop(0, `rgba(255,0,64,${boss.enraged ? 0.15 : 0.08})`);
  auraGrad.addColorStop(1, 'transparent');
  c.fillStyle = auraGrad;
  c.beginPath();
  c.arc(x, y, auraSize, 0, Math.PI * 2);
  c.fill();

  // Tentacles
  boss.tentacles.forEach(tentacle => {
    const ta = tentacle.angle + boss.angle;
    const endX = x + Math.cos(ta) * (tentacle.length + tentacle.wave);
    const endY = y + Math.sin(ta) * (tentacle.length + tentacle.wave);
    const midX = x + Math.cos(ta) * tentacle.length * 0.5 + Math.sin(ta) * 20;
    const midY = y + Math.sin(ta) * tentacle.length * 0.5 - Math.cos(ta) * 20;

    c.beginPath();
    c.moveTo(x, y);
    c.quadraticCurveTo(midX, midY, endX, endY);
    c.strokeStyle = flashIntensity ? '#ffffff' : `rgba(255,0,64,0.6)`;
    c.lineWidth = 4;
    c.stroke();

    // Tentacle tip
    c.beginPath();
    c.arc(endX, endY, 5, 0, Math.PI * 2);
    c.fillStyle = flashIntensity ? '#ffffff' : '#ff0040';
    c.fill();
  });

  // Arm rings
  boss.armAngles.forEach((armA, i) => {
    const aa = armA + boss.angle * 0.7;
    const armX = x + Math.cos(aa) * r * 0.8;
    const armY = y + Math.sin(aa) * r * 0.8;
    c.beginPath();
    c.arc(armX, armY, 10, 0, Math.PI * 2);
    c.fillStyle = flashIntensity ? '#ffffff' : `rgba(255,0,${100 + i*50},0.8)`;
    c.fill();
    c.strokeStyle = flashIntensity ? '#ffffff' : '#ff0040';
    c.lineWidth = 2;
    c.stroke();
  });

  // Main body
  c.save();
  c.translate(x, y);
  c.rotate(boss.angle);

  // Hexagonal body
  c.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const rVariant = r * (1 + Math.sin(t * 3 + i) * 0.05);
    i === 0 ? c.moveTo(Math.cos(a)*rVariant, Math.sin(a)*rVariant) : c.lineTo(Math.cos(a)*rVariant, Math.sin(a)*rVariant);
  }
  c.closePath();
  c.fillStyle = flashIntensity ? '#ffffff' : '#0d0015';
  c.fill();
  c.strokeStyle = flashIntensity ? '#ffffff' : (boss.enraged ? '#ff8800' : '#ff0040');
  c.lineWidth = 3;
  c.stroke();

  // Inner pattern
  for (let ring = 1; ring <= 3; ring++) {
    c.beginPath();
    c.arc(0, 0, r * ring / 4, 0, Math.PI * 2);
    c.strokeStyle = `rgba(255,0,64,${0.2 - ring * 0.05})`;
    c.lineWidth = 1.5;
    c.stroke();
  }

  // Eye
  const eyeR = r * 0.25;
  c.beginPath();
  c.arc(0, 0, eyeR, 0, Math.PI * 2);
  c.fillStyle = boss.enraged ? '#ff8800' : '#ff0040';
  c.fill();
  c.beginPath();
  c.arc(0, 0, eyeR * 0.5, 0, Math.PI * 2);
  c.fillStyle = '#000';
  c.fill();
  // Pupil glow
  const eyeGrad = c.createRadialGradient(0, 0, 0, 0, 0, eyeR);
  eyeGrad.addColorStop(0, 'rgba(255,255,255,0.8)');
  eyeGrad.addColorStop(1, 'transparent');
  c.fillStyle = eyeGrad;
  c.beginPath();
  c.arc(0, 0, eyeR * 0.3, 0, Math.PI * 2);
  c.fill();

  c.restore();

  // HP bar
  const bw = r * 4;
  const bh = 8;
  const bx = x - bw / 2;
  const by = y - r - 20;

  c.fillStyle = 'rgba(0,0,0,0.7)';
  c.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
  c.fillStyle = '#1a0008';
  c.fillRect(bx, by, bw, bh);
  const hpColor = hpPct > 0.5 ? '#ff4444' : hpPct > 0.25 ? '#ff8800' : '#ff0000';
  c.fillStyle = hpColor;
  c.fillRect(bx, by, bw * hpPct, bh);
  c.strokeStyle = 'rgba(255,0,64,0.5)';
  c.lineWidth = 1;
  c.strokeRect(bx, by, bw, bh);

  // Boss label
  c.fillStyle = '#ff0040';
  c.font = 'bold 11px Courier New';
  c.textAlign = 'center';
  c.fillText('⚠ BOSS', x, by - 5);
}

function drawBullets(c) {
  // Player bullets
  G.bullets.forEach(b => {
    const glow = c.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 2);
    glow.addColorStop(0, b.color + 'ff');
    glow.addColorStop(1, 'transparent');
    c.fillStyle = glow;
    c.beginPath();
    c.arc(b.x, b.y, b.r * 2, 0, Math.PI * 2);
    c.fill();

    c.beginPath();
    c.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    c.fillStyle = b.isCrit ? '#ffff00' : '#ffffff';
    c.fill();
  });

  // Enemy bullets
  G.enemyBullets.forEach(b => {
    c.beginPath();
    c.arc(b.x, b.y, b.r * 1.5, 0, Math.PI * 2);
    c.fillStyle = 'rgba(255,0,64,0.3)';
    c.fill();

    c.beginPath();
    c.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    c.fillStyle = b.color;
    c.fill();
  });
}

function drawParticles(c) {
  G.particles.forEach(p => {
    const alpha = p.fade ? Math.max(0, p.life / p.maxLife) : 1;
    c.globalAlpha = alpha;

    if (p.glow) {
      const glow = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2);
      glow.addColorStop(0, p.color);
      glow.addColorStop(1, 'transparent');
      c.fillStyle = glow;
      c.beginPath();
      c.arc(p.x, p.y, p.r * 2, 0, Math.PI * 2);
      c.fill();
    }

    c.fillStyle = p.color;
    c.beginPath();
    c.arc(p.x, p.y, Math.max(0.1, p.r), 0, Math.PI * 2);
    c.fill();

    c.globalAlpha = 1;
  });
}

function drawCollectibles(c) {
  G.collectibles.forEach(col => {
    const pulse = Math.sin(col.pulse) * 0.3 + 0.7;
    const color = col.type === 'xp' ? '#bf00ff' : '#00ff88';

    c.save();
    c.translate(col.x, col.y);

    // Glow
    const glow = c.createRadialGradient(0, 0, 0, 0, 0, col.r * 3);
    glow.addColorStop(0, color + '80');
    glow.addColorStop(1, 'transparent');
    c.fillStyle = glow;
    c.beginPath();
    c.arc(0, 0, col.r * 3, 0, Math.PI * 2);
    c.fill();

    // Gem shape
    c.rotate(col.pulse * 0.5);
    c.beginPath();
    c.moveTo(0, -col.r * pulse);
    c.lineTo(col.r * pulse * 0.7, 0);
    c.lineTo(0, col.r * pulse);
    c.lineTo(-col.r * pulse * 0.7, 0);
    c.closePath();
    c.fillStyle = color;
    c.fill();

    c.restore();
  });
}

function drawDamageNumbers(c) {
  G.damageNumbers.forEach(dn => {
    const alpha = Math.min(1, dn.life / dn.maxLife * 2);
    c.globalAlpha = alpha;
    c.font = `${dn.isCrit ? 'bold' : ''} ${dn.size}px Courier New`;
    c.textAlign = 'center';
    c.fillStyle = dn.color;
    c.fillText(dn.text, dn.x, dn.y);
    c.globalAlpha = 1;
  });
}

function drawScreenEffects(c, W, H) {
  // Scan lines (subtle)
  if (G.combo >= 10) {
    const scanAlpha = Math.min(0.04, G.combo * 0.001);
    for (let y = 0; y < H; y += 4) {
      c.fillStyle = `rgba(0,245,255,${scanAlpha})`;
      c.fillRect(0, y, W, 1);
    }
  }
}

// ============================================================
// MINIMAP
// ============================================================
function drawMinimap() {
  const c = miniCtx;
  const w = miniCanvas.width;
  const h = miniCanvas.height;
  const scaleX = w / G.worldW;
  const scaleY = h / G.worldH;

  c.clearRect(0, 0, w, h);
  c.fillStyle = 'rgba(0,5,20,0.9)';
  c.fillRect(0, 0, w, h);

  // World border
  c.strokeStyle = 'rgba(0,245,255,0.2)';
  c.lineWidth = 1;
  c.strokeRect(0, 0, w, h);

  // Camera viewport
  c.strokeStyle = 'rgba(0,245,255,0.15)';
  c.lineWidth = 0.5;
  c.strokeRect(G.camX * scaleX, G.camY * scaleY, G.W * scaleX, G.H * scaleY);

  // Enemies
  G.enemies.forEach(e => {
    if (e.dead) return;
    c.fillStyle = e.color;
    c.beginPath();
    c.arc(e.x * scaleX, e.y * scaleY, 2, 0, Math.PI * 2);
    c.fill();
  });

  // Boss
  if (G.boss) {
    c.fillStyle = '#ff0040';
    c.beginPath();
    c.arc(G.boss.x * scaleX, G.boss.y * scaleY, 5, 0, Math.PI * 2);
    c.fill();
  }

  // Collectibles
  G.collectibles.forEach(col => {
    c.fillStyle = col.type === 'xp' ? '#bf00ff' : '#00ff88';
    c.beginPath();
    c.arc(col.x * scaleX, col.y * scaleY, 1.5, 0, Math.PI * 2);
    c.fill();
  });

  // Player
  c.fillStyle = '#00f5ff';
  c.beginPath();
  c.arc(G.player.x * scaleX, G.player.y * scaleY, 3, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = '#00f5ff';
  c.lineWidth = 1;
  c.stroke();
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop(timestamp) {
  if (!G.running) return;

  // Delta time
  const rawDt = Math.min((timestamp - G.lastTime) / 1000, 0.05);
  G.lastTime = timestamp;
  G.dt = rawDt * G.timeScale;
  G.frameCount++;

  if (!G.paused) {
    // Update systems
    updateCamera();
    updatePlayer(G.dt);

    G.enemies.forEach(e => updateEnemy(e, G.dt));
    G.enemies = G.enemies.filter(e => !e.dead);

    if (G.boss && !G.boss.dead) updateBoss(G.boss, G.dt);

    updateBullets(G.dt);
    updateCollectibles(G.dt);
    updateParticles(G.dt);
    updateSkillCooldowns(rawDt);
    updateWave(G.dt);

    // Combo decay text color based on intensity
    if (G.combo >= 30) {
      // Intense mode: screen effects
      if (G.frameCount % 60 === 0 && G.settings.particles) {
        spawnParticle(
          G.player.x + Util.rand(-G.W/2, G.W/2),
          G.player.y + Util.rand(-G.H/2, G.H/2),
          { color: '#00f5ff', r: 3, speed: 50, life: 0.8 }
        );
      }
    }
  }

  // Render always
  render();

  G.animId = requestAnimationFrame(gameLoop);
}

// ============================================================
// GAME START / END
// ============================================================
function startGame() {
  // Setup dimensions
  G.W = canvas.width = window.innerWidth;
  G.H = canvas.height = window.innerHeight;

  // Load settings
  const saveData = Save.get();
  G.settings = { ...saveData.settings };
  G.settings.volume = G.settings.volume / 100;

  // Reset game state
  G.score = 0;
  G.wave = 1;
  G.kills = 0;
  G.sessionKills = 0;
  G.level = 1;
  G.exp = 0;
  G.expNeeded = 20;
  G.combo = 0;
  G.comboMax = 0;
  G.comboTimer = 0;
  G.critCount = 0;
  G.totalDamageDealt = 0;
  G.enemies = [];
  G.bullets = [];
  G.enemyBullets = [];
  G.particles = [];
  G.damageNumbers = [];
  G.collectibles = [];
  G.upgrades = {};
  G.bossActive = false;
  G.bossKilled = false;
  G.boss = null;
  G.timeScale = 1;
  G.camX = 0;
  G.camY = 0;
  G.camShakePower = 0;
  G.screenFlashAlpha = 0;
  G.shootTimer = 0;
  G.shootInterval = 0.15;

  // Create player
  G.player = createPlayer();
  G.player.x = G.worldW / 2;
  G.player.y = G.worldH / 2;

  // Default skills
  G.skills = [...SKILLS_DEF];
  G.skillCooldowns = [0, 0, 0];

  // Show game screen
  document.getElementById('titleScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');

  // Close all overlays
  document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));

  G.running = true;
  G.paused = false;
  G.lastTime = performance.now();

  // Start game loop
  if (G.animId) cancelAnimationFrame(G.animId);
  G.animId = requestAnimationFrame(gameLoop);

  // Audio
  Audio.init();
  Audio.resume();
  Audio.setVolume(G.settings.volume);
  Audio.setSFX(G.settings.sfx);
  if (G.settings.music) Audio.startMusic();

  // Start first wave
  startWave();
  updateHUD();
  updateSkillSlotUI();

  // Welcome toast
  showToast('⚡ CYBER VOID - SURVIVE!');
}

function endGame() {
  G.running = false;
  Audio.stopMusic();

  // Save stats
  const saveData = Save.get();
  const isNewBest = G.score > saveData.bestScore;

  Save.update(d => {
    if (G.score > d.bestScore) d.bestScore = G.score;
    if (G.wave > d.bestWave) d.bestWave = G.wave;
    d.totalKills = (d.totalKills || 0) + G.sessionKills;
  });

  // Show game over
  const goEl = document.getElementById('gameOverOverlay');
  const stats = document.getElementById('gameoverStats');
  stats.innerHTML = `
    <div class="go-stat"><span class="go-stat-label">SCORE</span><span class="go-stat-value">${Util.formatNum(G.score)}</span></div>
    <div class="go-stat"><span class="go-stat-label">WAVE</span><span class="go-stat-value">${G.wave}</span></div>
    <div class="go-stat"><span class="go-stat-label">KILLS</span><span class="go-stat-value">${G.sessionKills}</span></div>
    <div class="go-stat"><span class="go-stat-label">MAX COMBO</span><span class="go-stat-value">x${G.comboMax}</span></div>
    <div class="go-stat"><span class="go-stat-label">LEVEL</span><span class="go-stat-value">${G.level}</span></div>
    <div class="go-stat"><span class="go-stat-label">DAMAGE</span><span class="go-stat-value">${Util.formatNum(Math.round(G.totalDamageDealt))}</span></div>
  `;

  document.getElementById('newRecord').style.display = isNewBest ? 'block' : 'none';
  goEl.classList.add('active');

  // Big death explosion
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      spawnExplosion(G.player.x, G.player.y, 80, '#ff0040', 30);
      screenShake(20, 0.5);
    }, i * 200);
  }
}

function togglePause() {
  G.paused = !G.paused;
  document.getElementById('pauseOverlay').classList.toggle('active', G.paused);
  if (G.paused) {
    Audio.stopMusic();
  } else {
    if (G.settings.music) Audio.startMusic();
  }
}

function toggleAdminPanel() {
  G.adminPanelOpen = !G.adminPanelOpen;
  const overlay = document.getElementById('adminOverlay');
  overlay.classList.toggle('active', G.adminPanelOpen);
  if (G.adminPanelOpen) updateAdminPanel();
}

function updateAdminPanel() {
  const content = document.getElementById('adminPanelContent');
  if (!content) return;
  content.innerHTML = `
    <div style="margin-bottom:1em; font-size:0.95rem; color: #fff;">
      <div><strong>WAVE:</strong> ${G.wave}</div>
      <div><strong>SCORE:</strong> ${G.score.toLocaleString()}</div>
      <div><strong>ENEMIES:</strong> ${G.enemies.length}</div>
      <div><strong>BOSS ACTIVE:</strong> ${G.bossActive || (G.boss && !G.boss.dead) ? 'YES' : 'NO'}</div>
      <div><strong>PLAYER HP:</strong> ${Math.round(G.player.hp)} / ${G.player.maxHp}</div>
      <div><strong>AUTO SHOOT:</strong> ON</div>
    </div>
  `;
}

// ============================================================
// UI SETUP
// ============================================================
function initUI() {
  // Title screen buttons
  document.getElementById('btnPlay').addEventListener('click', () => {
    Audio.init();
    Audio.resume();
    Audio.sounds.click();
    startGame();
  });

  document.getElementById('btnSettings').addEventListener('click', () => {
    Audio.sounds.click();
    document.getElementById('settingsOverlay').classList.add('active');
    document.getElementById('gameScreen').classList.add('active');
    document.getElementById('titleScreen').classList.remove('active');
    G.running = false;
  });

  document.getElementById('btnFullscreen').addEventListener('click', () => {
    Audio.sounds.click();
    toggleFullscreen();
  });

  // In-game buttons
  document.getElementById('btnResume').addEventListener('click', () => {
    Audio.sounds.click();
    togglePause();
  });

  document.getElementById('btnSettingsIngame').addEventListener('click', () => {
    Audio.sounds.click();
    document.getElementById('pauseOverlay').classList.remove('active');
    document.getElementById('settingsOverlay').classList.add('active');
  });

  document.getElementById('btnQuit').addEventListener('click', () => {
    Audio.sounds.click();
    G.running = false;
    Audio.stopMusic();
    document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
    document.getElementById('gameScreen').classList.remove('active');
    document.getElementById('titleScreen').classList.add('active');
    updateTitleStats();
  });

  document.getElementById('btnRestart').addEventListener('click', () => {
    Audio.sounds.click();
    document.getElementById('gameOverOverlay').classList.remove('active');
    startGame();
  });

  document.getElementById('btnMenu').addEventListener('click', () => {
    Audio.sounds.click();
    G.running = false;
    document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
    document.getElementById('gameScreen').classList.remove('active');
    document.getElementById('titleScreen').classList.add('active');
    updateTitleStats();
  });

  document.getElementById('btnCloseSettings').addEventListener('click', () => {
    Audio.sounds.click();
    document.getElementById('settingsOverlay').classList.remove('active');
    if (!G.running) {
      document.getElementById('gameScreen').classList.remove('active');
      document.getElementById('titleScreen').classList.add('active');
    } else {
      document.getElementById('pauseOverlay').classList.add('active');
    }
  });

  document.getElementById('btnCloseAdmin').addEventListener('click', () => {
    Audio.sounds.click();
    toggleAdminPanel();
  });

  // Settings toggles
  const savedSettings = Save.get().settings;

  const toggleSFX = document.getElementById('toggleSFX');
  const toggleMusic = document.getElementById('toggleMusic');
  const toggleShake = document.getElementById('toggleShake');
  const toggleParticles = document.getElementById('toggleParticles');
  const volumeSlider = document.getElementById('volumeSlider');

  toggleSFX.checked = savedSettings.sfx !== false;
  toggleMusic.checked = savedSettings.music !== false;
  toggleShake.checked = savedSettings.shake !== false;
  toggleParticles.checked = savedSettings.particles !== false;
  volumeSlider.value = savedSettings.volume !== undefined ? savedSettings.volume : 70;

  function saveSettings() {
    const s = {
      sfx: toggleSFX.checked,
      music: toggleMusic.checked,
      shake: toggleShake.checked,
      particles: toggleParticles.checked,
      volume: parseInt(volumeSlider.value),
    };
    Save.update(d => d.settings = s);
    G.settings = { ...s, volume: s.volume / 100 };
    Audio.setVolume(G.settings.volume);
    Audio.setSFX(G.settings.sfx);
    Audio.setMusic(G.settings.music);
  }

  [toggleSFX, toggleMusic, toggleShake, toggleParticles, volumeSlider].forEach(el => {
    el.addEventListener('change', saveSettings);
    el.addEventListener('input', saveSettings);
  });

  // Skill slots click (keyboard Q/E/R handled in keydown)
  document.getElementById('skill0').addEventListener('click', () => activateSkill(0));
  document.getElementById('skill1').addEventListener('click', () => activateSkill(1));
  document.getElementById('skill2').addEventListener('click', () => activateSkill(2));

  // Pause button (HUD)
  // Added later if needed

  // Resize
  window.addEventListener('resize', () => {
    G.W = canvas.width = window.innerWidth;
    G.H = canvas.height = window.innerHeight;
    miniCanvas.width = miniCanvas.offsetWidth * 1.5;
    miniCanvas.height = miniCanvas.offsetHeight * 1.5;
  });
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

function updateTitleStats() {
  const d = Save.get();
  document.getElementById('titleBestScore').textContent = Util.formatNum(d.bestScore || 0);
  document.getElementById('titleBestWave').textContent = d.bestWave || 0;
  document.getElementById('titleTotalKills').textContent = Util.formatNum(d.totalKills || 0);
}

// ============================================================
// TITLE BG ANIMATION
// ============================================================
function initTitleBg() {
  const bgCanvas = document.getElementById('titleBgCanvas');
  const bgCtx = bgCanvas.getContext('2d');

  const particles = [];
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: Math.random(),
      y: Math.random(),
      vx: (Math.random() - 0.5) * 0.0002,
      vy: -Math.random() * 0.0003 - 0.0001,
      r: Math.random() * 2 + 0.5,
      color: Math.random() < 0.5 ? '#00f5ff' : '#bf00ff',
      alpha: Math.random() * 0.6 + 0.2,
    });
  }

  let hexagons = [];
  for (let i = 0; i < 6; i++) {
    hexagons.push({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 60 + 30,
      angle: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.005,
      alpha: Math.random() * 0.08 + 0.02,
    });
  }

  let animFrame;
  function animate() {
    const w = bgCanvas.width = bgCanvas.offsetWidth;
    const h = bgCanvas.height = bgCanvas.offsetHeight;
    bgCtx.clearRect(0, 0, w, h);

    // Animated hexagons
    hexagons.forEach(hex => {
      hex.angle += hex.rotSpeed;
      const hx = hex.x * w;
      const hy = hex.y * h;
      bgCtx.save();
      bgCtx.translate(hx, hy);
      bgCtx.rotate(hex.angle);
      bgCtx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        i === 0 ? bgCtx.moveTo(Math.cos(a)*hex.r, Math.sin(a)*hex.r) : bgCtx.lineTo(Math.cos(a)*hex.r, Math.sin(a)*hex.r);
      }
      bgCtx.closePath();
      bgCtx.strokeStyle = `rgba(0,245,255,${hex.alpha})`;
      bgCtx.lineWidth = 1;
      bgCtx.stroke();
      bgCtx.restore();
    });

    // Particles
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.y < -0.05) p.y = 1.05;
      if (p.x < -0.05) p.x = 1.05;
      if (p.x > 1.05) p.x = -0.05;

      bgCtx.beginPath();
      bgCtx.arc(p.x * w, p.y * h, p.r, 0, Math.PI * 2);
      bgCtx.fillStyle = p.color.replace(')', `,${p.alpha})`).replace('rgb', 'rgba').replace('#00f5ff', `rgba(0,245,255,${p.alpha})`).replace('#bf00ff', `rgba(191,0,255,${p.alpha})`);

      // Fix color
      bgCtx.fillStyle = p.color;
      bgCtx.globalAlpha = p.alpha;
      bgCtx.fill();
      bgCtx.globalAlpha = 1;
    });

    animFrame = requestAnimationFrame(animate);
  }

  animate();
  return () => cancelAnimationFrame(animFrame);
}

// ============================================================
// INITIALIZATION
// ============================================================
function init() {
  try {
    // Load save data
    Save.load();
    updateTitleStats();

    // Resize canvas
    resizeCanvas();

    // Init input
    initInput();

    // Init UI
    initUI();

    // Title background
    initTitleBg();

    // Apply saved settings to toggles
    const settings = Save.get().settings;

    // Global error recovery
    window.addEventListener('error', (e) => {
      console.error('Game error (recovering):', e.error);
      // Try to resume game loop if stopped
      if (G.running && !G.animId) {
        G.animId = requestAnimationFrame(gameLoop);
      }
    });

    console.log('[CYBER VOID] Game loaded successfully!');
  } catch(e) {
    console.error('[CYBER VOID] Init error:', e);
  }
}

// Start when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})(); // End IIFE
</script>
