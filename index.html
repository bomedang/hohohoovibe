
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CYBER VOID</title>
<style>
/* ============================================
   GLOBAL RESET & VARIABLES
   ============================================ */
:root {
  --neon-blue: #00f5ff;
  --neon-purple: #bf00ff;
  --neon-cyan: #00ffcc;
  --neon-red: #ff0040;
  --neon-yellow: #ffcc00;
  --neon-green: #00ff88;
  --bg-dark: #050810;
  --bg-panel: rgba(0, 10, 30, 0.85);
  --border-glow: rgba(0, 245, 255, 0.3);
  --font-main: 'Courier New', monospace;
  --ui-radius: 12px;
  --ui-radius-sm: 8px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-dark);
  font-family: var(--font-main);
  color: var(--neon-blue);
  touch-action: none;
}

/* ============================================
   SCREEN MANAGEMENT
   ============================================ */
.screen {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.screen.active {
  display: flex;
}

/* ============================================
   CANVAS GAME AREA
   ============================================ */
#gameCanvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: block;
}

/* ============================================
   TITLE SCREEN
   ============================================ */
#titleScreen {
  background: radial-gradient(ellipse at center, #0a0f2e 0%, #050810 70%);
  z-index: 10;
}

.title-bg-canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}

.title-content {
  position: relative;
  z-index: 2;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}

.title-logo {
  font-size: clamp(3rem, 12vw, 7rem);
  font-weight: 900;
  letter-spacing: 0.15em;
  color: var(--neon-blue);
  text-shadow:
    0 0 10px var(--neon-blue),
    0 0 30px var(--neon-blue),
    0 0 60px var(--neon-blue),
    0 0 100px rgba(0, 245, 255, 0.5);
  animation: titlePulse 3s ease-in-out infinite;
  line-height: 1;
}

.title-sub {
  font-size: clamp(0.7rem, 3vw, 1.1rem);
  letter-spacing: 0.5em;
  color: var(--neon-purple);
  text-shadow: 0 0 15px var(--neon-purple);
  margin-top: 0.3em;
  margin-bottom: 2.5em;
  text-transform: uppercase;
}

@keyframes titlePulse {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.3) drop-shadow(0 0 20px var(--neon-blue)); }
}

/* ============================================
   BUTTONS
   ============================================ */
.btn {
  position: relative;
  padding: 0.75em 2.5em;
  font-family: var(--font-main);
  font-size: clamp(0.85rem, 3vw, 1.1rem);
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--neon-blue);
  background: rgba(0, 245, 255, 0.05);
  border: 2px solid rgba(0, 245, 255, 0.5);
  border-radius: var(--ui-radius);
  cursor: pointer;
  transition: all 0.2s ease;
  overflow: hidden;
  min-width: 200px;
  text-align: center;
}

.btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(0, 245, 255, 0.2), transparent);
  transition: left 0.4s ease;
}

.btn:hover::before, .btn:active::before {
  left: 100%;
}

.btn:hover, .btn:active {
  background: rgba(0, 245, 255, 0.15);
  border-color: var(--neon-blue);
  box-shadow: 0 0 20px rgba(0, 245, 255, 0.4), inset 0 0 20px rgba(0, 245, 255, 0.05);
  transform: translateY(-2px);
  color: #fff;
}

.btn-primary {
  color: var(--bg-dark);
  background: var(--neon-blue);
  border-color: var(--neon-blue);
  box-shadow: 0 0 20px rgba(0, 245, 255, 0.6), 0 0 40px rgba(0, 245, 255, 0.3);
  font-weight: 900;
}

.btn-primary:hover, .btn-primary:active {
  background: #fff;
  color: var(--bg-dark);
  box-shadow: 0 0 30px var(--neon-blue), 0 0 60px rgba(0, 245, 255, 0.5);
}

.btn-danger {
  color: var(--neon-red);
  border-color: rgba(255, 0, 64, 0.5);
  background: rgba(255, 0, 64, 0.05);
}

.btn-danger:hover, .btn-danger:active {
  background: rgba(255, 0, 64, 0.15);
  border-color: var(--neon-red);
  box-shadow: 0 0 20px rgba(255, 0, 64, 0.4);
}

.btn-grid {
  display: flex;
  flex-direction: column;
  gap: 0.8em;
  align-items: center;
  width: 100%;
  max-width: 280px;
}

/* ============================================
   BEST SCORE DISPLAY ON TITLE
   ============================================ */
.title-stats {
  display: flex;
  gap: 2em;
  margin-bottom: 2em;
  font-size: clamp(0.7rem, 2.5vw, 0.9rem);
}

.stat-box {
  text-align: center;
  background: var(--bg-panel);
  border: 1px solid var(--border-glow);
  border-radius: var(--ui-radius-sm);
  padding: 0.5em 1em;
  backdrop-filter: blur(10px);
}

.stat-label {
  color: rgba(0, 245, 255, 0.5);
  font-size: 0.8em;
  letter-spacing: 0.1em;
}

.stat-value {
  color: var(--neon-yellow);
  font-size: 1.3em;
  font-weight: 700;
  text-shadow: 0 0 10px var(--neon-yellow);
}

/* ============================================
   HUD (In-Game UI)
   ============================================ */
#hud {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 5;
}

/* Top HUD Bar */
.hud-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 10px 12px 0;
  gap: 8px;
}

/* Health Bar */
.hp-section {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 140px;
  max-width: 200px;
  flex: 1;
}

.hp-label {
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  color: var(--neon-red);
  text-shadow: 0 0 8px var(--neon-red);
  display: flex;
  justify-content: space-between;
}

.bar-track {
  height: 10px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 5px;
  border: 1px solid rgba(255, 0, 64, 0.3);
  overflow: hidden;
  position: relative;
}

.bar-fill {
  height: 100%;
  border-radius: 5px;
  transition: width 0.3s ease;
  position: relative;
}

.hp-fill {
  background: linear-gradient(90deg, #ff0040, #ff4488);
  box-shadow: 0 0 8px rgba(255, 0, 64, 0.8);
}

.shield-fill {
  background: linear-gradient(90deg, #0088ff, #00ccff);
  box-shadow: 0 0 8px rgba(0, 136, 255, 0.8);
}

/* EXP Bar */
.exp-section {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 0 12px 6px;
}

.exp-bar-track {
  height: 6px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 3px;
  border: 1px solid rgba(0, 255, 204, 0.2);
  overflow: hidden;
}

.exp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan));
  box-shadow: 0 0 10px var(--neon-cyan);
  border-radius: 3px;
  transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Center Score */
.score-section {
  text-align: center;
  flex-shrink: 0;
}

.score-value {
  font-size: clamp(1.2rem, 5vw, 2rem);
  font-weight: 900;
  color: var(--neon-yellow);
  text-shadow: 0 0 15px var(--neon-yellow), 0 0 30px rgba(255, 204, 0, 0.5);
  line-height: 1;
  letter-spacing: 0.05em;
}

.score-label {
  font-size: 0.55rem;
  color: rgba(255, 204, 0, 0.5);
  letter-spacing: 0.2em;
}

.wave-display {
  font-size: 0.7rem;
  color: var(--neon-purple);
  letter-spacing: 0.1em;
  margin-top: 2px;
}

/* Right side stats */
.right-hud {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  min-width: 100px;
}

.level-badge {
  background: linear-gradient(135deg, rgba(191, 0, 255, 0.2), rgba(0, 245, 255, 0.1));
  border: 1px solid rgba(191, 0, 255, 0.5);
  border-radius: var(--ui-radius-sm);
  padding: 3px 10px;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  color: var(--neon-purple);
  text-shadow: 0 0 8px var(--neon-purple);
}

.level-num {
  font-size: 1.1em;
  font-weight: 900;
  color: #fff;
}

.combo-display {
  font-size: clamp(0.75rem, 3vw, 1rem);
  font-weight: 700;
  color: var(--neon-cyan);
  text-shadow: 0 0 10px var(--neon-cyan);
  text-align: right;
  transition: all 0.2s;
}

/* Kill counter */
.kills-display {
  font-size: 0.65rem;
  color: rgba(0, 245, 255, 0.6);
  letter-spacing: 0.1em;
}

/* Pause / Settings Buttons */
.hud-buttons {
  position: absolute;
  top: 8px;
  right: 12px;
  display: flex;
  gap: 6px;
  pointer-events: all;
}

.icon-btn {
  width: 34px;
  height: 34px;
  background: rgba(0, 245, 255, 0.08);
  border: 1px solid rgba(0, 245, 255, 0.3);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.2s;
  color: var(--neon-blue);
}

.icon-btn:hover, .icon-btn:active {
  background: rgba(0, 245, 255, 0.2);
  border-color: var(--neon-blue);
  box-shadow: 0 0 10px rgba(0, 245, 255, 0.3);
}

/* Skill slots */
.skill-slots {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  pointer-events: all;
}

.skill-slot {
  width: clamp(44px, 12vw, 54px);
  height: clamp(44px, 12vw, 54px);
  background: rgba(0, 10, 30, 0.8);
  border: 2px solid rgba(0, 245, 255, 0.3);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  font-size: 1.2rem;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  overflow: hidden;
}

.skill-slot:hover {
  border-color: var(--neon-blue);
  box-shadow: 0 0 12px rgba(0, 245, 255, 0.3);
}

.skill-slot.on-cooldown::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0;
  width: 100%;
  height: var(--cooldown-pct, 0%);
  background: rgba(0, 0, 0, 0.6);
  transition: height 0.1s linear;
}

.skill-key {
  font-size: 0.55rem;
  color: rgba(0, 245, 255, 0.5);
  position: absolute;
  bottom: 3px;
  right: 4px;
}

/* ============================================
   OVERLAYS (Pause, Level Up, Game Over, etc.)
   ============================================ */
.overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(8px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 20;
  gap: 1.2em;
}

.overlay.active {
  display: flex;
}

.overlay-title {
  font-size: clamp(1.8rem, 7vw, 3rem);
  font-weight: 900;
  letter-spacing: 0.15em;
  text-shadow: 0 0 20px currentColor, 0 0 40px currentColor;
  animation: overlayTitleAnim 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes overlayTitleAnim {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.overlay-panel {
  background: var(--bg-panel);
  border: 1px solid var(--border-glow);
  border-radius: var(--ui-radius);
  padding: 1.5em 2em;
  backdrop-filter: blur(20px);
  min-width: min(85vw, 340px);
  max-width: 420px;
  animation: overlayTitleAnim 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Level Up Cards */
.levelup-cards {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 90vw;
}

.upgrade-card {
  width: clamp(130px, 28vw, 160px);
  background: rgba(0, 10, 30, 0.9);
  border: 2px solid rgba(0, 245, 255, 0.3);
  border-radius: var(--ui-radius);
  padding: 1em;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-align: center;
  pointer-events: all;
  position: relative;
  overflow: hidden;
}

.upgrade-card::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(0, 245, 255, 0.05) 0%, transparent 70%);
  transform: scale(0);
  transition: transform 0.3s;
}

.upgrade-card:hover::before {
  transform: scale(1);
}

.upgrade-card:hover {
  border-color: var(--neon-blue);
  box-shadow: 0 0 20px rgba(0, 245, 255, 0.3), 0 8px 30px rgba(0, 0, 0, 0.5);
  transform: translateY(-6px) scale(1.03);
}

.upgrade-card:active {
  transform: translateY(-2px) scale(0.98);
}

.upgrade-icon {
  font-size: 2rem;
  margin-bottom: 0.3em;
  display: block;
}

.upgrade-name {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--neon-blue);
  letter-spacing: 0.05em;
  margin-bottom: 0.3em;
}

.upgrade-desc {
  font-size: 0.65rem;
  color: rgba(255, 255, 255, 0.5);
  line-height: 1.4;
}

.upgrade-rarity {
  font-size: 0.6rem;
  margin-top: 0.4em;
  letter-spacing: 0.1em;
}

.rarity-common { color: rgba(200, 200, 200, 0.7); }
.rarity-rare { color: var(--neon-blue); text-shadow: 0 0 8px var(--neon-blue); }
.rarity-epic { color: var(--neon-purple); text-shadow: 0 0 8px var(--neon-purple); }
.rarity-legendary { color: var(--neon-yellow); text-shadow: 0 0 12px var(--neon-yellow); }

/* Boss warning */
.boss-warning {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(2rem, 8vw, 4rem);
  font-weight: 900;
  color: var(--neon-red);
  text-shadow: 0 0 30px var(--neon-red), 0 0 60px var(--neon-red);
  letter-spacing: 0.2em;
  pointer-events: none;
  z-index: 25;
  display: none;
  animation: bossWarn 0.4s ease-in-out infinite alternate;
}

@keyframes bossWarn {
  from { opacity: 0.5; transform: translate(-50%, -50%) scale(0.95); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
}

/* Cinematic bars */
.cinematic-bars {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 22;
}

.cbar-top, .cbar-bottom {
  position: absolute;
  left: 0; right: 0;
  height: 0;
  background: #000;
  transition: height 0.5s ease;
}

.cbar-top { top: 0; }
.cbar-bottom { bottom: 0; }

/* ============================================
   SETTINGS PANEL
   ============================================ */
.settings-panel {
  background: var(--bg-panel);
  border: 1px solid var(--border-glow);
  border-radius: var(--ui-radius);
  padding: 1.5em;
  width: min(90vw, 360px);
  backdrop-filter: blur(20px);
}

.settings-title {
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--neon-blue);
  margin-bottom: 1.2em;
  text-align: center;
  text-shadow: 0 0 10px var(--neon-blue);
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.9em;
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.7);
}

.setting-row label {
  letter-spacing: 0.05em;
}

/* Toggle switch */
.toggle {
  position: relative;
  width: 44px;
  height: 22px;
  cursor: pointer;
}

.toggle input {
  opacity: 0;
  width: 0; height: 0;
}

.toggle-slider {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(0, 245, 255, 0.3);
  border-radius: 11px;
  transition: 0.3s;
}

.toggle-slider::before {
  content: '';
  position: absolute;
  width: 16px; height: 16px;
  left: 3px; bottom: 2px;
  background: rgba(255, 255, 255, 0.4);
  border-radius: 50%;
  transition: 0.3s;
}

.toggle input:checked + .toggle-slider {
  background: rgba(0, 245, 255, 0.2);
  border-color: var(--neon-blue);
  box-shadow: 0 0 8px rgba(0, 245, 255, 0.3);
}

.toggle input:checked + .toggle-slider::before {
  transform: translateX(22px);
  background: var(--neon-blue);
}

/* Range slider */
.range-slider {
  -webkit-appearance: none;
  width: 100px;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.15);
  outline: none;
  cursor: pointer;
}

.range-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--neon-blue);
  box-shadow: 0 0 8px var(--neon-blue);
  cursor: pointer;
}

/* ============================================
   MINIMAP
   ============================================ */
.minimap-container {
  position: absolute;
  bottom: 70px;
  right: 10px;
  width: clamp(80px, 20vw, 100px);
  height: clamp(80px, 20vw, 100px);
  background: rgba(0, 5, 20, 0.8);
  border: 1px solid rgba(0, 245, 255, 0.2);
  border-radius: 8px;
  overflow: hidden;
}

#minimapCanvas {
  width: 100%;
  height: 100%;
}

/* ============================================
   TOAST NOTIFICATIONS
   ============================================ */
.toast-container {
  position: absolute;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
  pointer-events: none;
  z-index: 30;
}

.toast {
  background: rgba(0, 10, 30, 0.9);
  border: 1px solid rgba(0, 245, 255, 0.4);
  border-radius: 20px;
  padding: 0.5em 1.2em;
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  color: var(--neon-cyan);
  text-shadow: 0 0 8px var(--neon-cyan);
  animation: toastAnim 2.5s ease forwards;
  white-space: nowrap;
}

@keyframes toastAnim {
  0% { opacity: 0; transform: translateY(-10px) scale(0.9); }
  15% { opacity: 1; transform: translateY(0) scale(1); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-5px) scale(0.95); }
}

/* ============================================
   GAME OVER SCREEN
   ============================================ */
.gameover-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.8em;
  margin: 0.8em 0;
}

.go-stat {
  text-align: center;
  padding: 0.5em;
  background: rgba(0, 245, 255, 0.05);
  border: 1px solid rgba(0, 245, 255, 0.15);
  border-radius: 8px;
}

.go-stat-label {
  font-size: 0.6rem;
  color: rgba(255, 255, 255, 0.4);
  letter-spacing: 0.1em;
  display: block;
}

.go-stat-value {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--neon-yellow);
  text-shadow: 0 0 8px var(--neon-yellow);
}

/* New record */
.new-record {
  font-size: 0.8rem;
  color: var(--neon-green);
  text-shadow: 0 0 10px var(--neon-green);
  letter-spacing: 0.2em;
  animation: blink 0.8s ease-in-out infinite alternate;
}

@keyframes blink {
  from { opacity: 0.5; }
  to { opacity: 1; }
}

/* ============================================
   JOYSTICK (MOBILE)
   ============================================ */
.joystick-area {
  position: absolute;
  bottom: 70px;
  left: 20px;
  width: 100px;
  height: 100px;
  pointer-events: all;
  z-index: 10;
}

.joystick-base {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: rgba(0, 245, 255, 0.05);
  border: 2px solid rgba(0, 245, 255, 0.2);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.joystick-knob {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 245, 255, 0.4), rgba(0, 245, 255, 0.1));
  border: 2px solid rgba(0, 245, 255, 0.6);
  box-shadow: 0 0 10px rgba(0, 245, 255, 0.3);
  position: absolute;
  transition: none;
  cursor: grab;
}

/* Action button (mobile) */

  transform: scale(0.9);
  background: rgba(191, 0, 255, 0.3);
}

/* ============================================
   SCREEN EFFECTS
   ============================================ */
.vignette {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
  pointer-events: none;
  z-index: 4;
}

.damage-flash {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(255, 0, 64, 0);
  pointer-events: none;
  z-index: 6;
  border: 0px solid rgba(255, 0, 64, 0);
  transition: background 0.1s, border 0.1s;
}

.damage-flash.flash {
  background: rgba(255, 0, 64, 0.12);
  border: 8px solid rgba(255, 0, 64, 0.4);
}

.low-hp-warning {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: 4px solid transparent;
  pointer-events: none;
  z-index: 4;
  animation: lowHpPulse 1s ease-in-out infinite;
  opacity: 0;
  transition: opacity 0.5s;
}

.low-hp-warning.active {
  border-color: rgba(255, 0, 64, 0.4);
  opacity: 1;
}

@keyframes lowHpPulse {
  0%, 100% { box-shadow: inset 0 0 20px rgba(255, 0, 64, 0.1); }
  50% { box-shadow: inset 0 0 60px rgba(255, 0, 64, 0.3); }
}

/* Glitch effect for boss fight */
.glitch-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;

  z-index: 7;

<script>
/* ============================================================
   CYBER VOID - Complete Game Engine
   Version 1.0.0
   ============================================================ */

(function() {
'use strict';

// ============================================================
// AUDIO ENGINE (WebAudio API)
// ============================================================
const Audio = (() => {
  let ctx = null;
  let masterGain = null;
  let musicOsc = null;
  let musicGain = null;
  let musicInterval = null;
  const settings = { sfx: true, music: true, volume: 0.7 };

  // Lazily create AudioContext on first interaction
  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx.createGain();
      masterGain.gain.value = settings.volume;
      masterGain.connect(ctx.destination);
    } catch(e) { console.warn('WebAudio unavailable'); }
  }

  // Resume AudioContext (required after user gesture)
  function resume() {
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }

  // Generic tone generator
  function tone(freq, type, duration, gain = 0.3, attack = 0.01, decay = 0.05, startFreq = null) {
    if (!ctx || !settings.sfx) return;
    try {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.connect(g);
      g.connect(masterGain);
      osc.type = type;
      osc.frequency.setValueAtTime(startFreq || freq, ctx.currentTime);
      if (startFreq) osc.frequency.exponentialRampToValueAtTime(freq, ctx.currentTime + duration * 0.3);
      g.gain.setValueAtTime(0, ctx.currentTime);
      g.gain.linearRampToValueAtTime(gain, ctx.currentTime + attack);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch(e) {}
  }

  // Noise burst (explosion)
  function noise(duration, gain = 0.2) {
    if (!ctx || !settings.sfx) return;
    try {
      const bufSize = ctx.sampleRate * duration;
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const g = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 200;
      src.connect(filter);
      filter.connect(g);
      g.connect(masterGain);
      g.gain.setValueAtTime(gain, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      src.start();
      src.stop(ctx.currentTime + duration);
    } catch(e) {}
  }

  // Sound library
  const sounds = {
    shoot() { tone(800, 'square', 0.08, 0.15, 0.005, 0.08, 1200); },
    hit() { tone(200, 'sawtooth', 0.1, 0.25, 0.005, 0.1, 400); noise(0.05, 0.1); },
    enemyDie() { noise(0.12, 0.3); tone(150, 'sawtooth', 0.15, 0.2, 0.005, 0.15, 300); },
    playerHit() { tone(100, 'sawtooth', 0.2, 0.4, 0.005, 0.2, 200); noise(0.1, 0.2); },
    levelUp() {
      [523, 659, 784, 1047].forEach((f, i) => {
        setTimeout(() => tone(f, 'sine', 0.25, 0.3), i * 80);
      });
    },
    bossWarn() {
      tone(60, 'sawtooth', 0.6, 0.5, 0.05, 0.6);
      tone(80, 'square', 0.4, 0.3, 0.1, 0.4);
    },
    click() { tone(600, 'sine', 0.08, 0.15, 0.005, 0.08); },
    skill() { tone(440, 'triangle', 0.2, 0.3, 0.01, 0.2, 880); },
    criticalHit() { tone(1200, 'square', 0.12, 0.4, 0.005, 0.12, 600); noise(0.08, 0.15); },
    collect() { tone(880, 'sine', 0.1, 0.2, 0.005, 0.1); },
    bossDie() {
      noise(0.5, 0.5);
      [200, 150, 100, 60].forEach((f, i) => setTimeout(() => tone(f, 'sawtooth', 0.2, 0.4), i * 100));
    },
    shield() { tone(700, 'triangle', 0.15, 0.2, 0.01, 0.15); },
    upgrade() { [392, 523, 659].forEach((f, i) => setTimeout(() => tone(f, 'sine', 0.2, 0.25), i * 60)); }
  };

  // Background music (generative)
  let beatStep = 0;
  const bassline = [55, 55, 65, 55, 49, 55, 62, 55];
  const melody = [220, 247, 262, 294, 330, 294, 247, 220];

  function startMusic() {
    if (!ctx || !settings.music) return;
    const bpm = 140;
    const interval = (60 / bpm) * 0.5 * 1000;
    musicInterval = setInterval(() => {
      if (!settings.music) return;
      const freq = bassline[beatStep % bassline.length];
      tone(freq, 'sawtooth', 0.18, 0.06, 0.01, 0.18);
      if (beatStep % 4 === 0) {
        noise(0.05, 0.05); // kick
      }
      if (beatStep % 2 === 0) {
        tone(melody[beatStep % melody.length] * 2, 'triangle', 0.1, 0.04, 0.005, 0.1);
      }
      beatStep++;
    }, interval);
  }

  function stopMusic() {
    if (musicInterval) clearInterval(musicInterval);
    musicInterval = null;
  }

  return {
    init, resume, sounds, startMusic, stopMusic,
    setVolume(v) { settings.volume = v; if(masterGain) masterGain.gain.value = v; },
    setSFX(v) { settings.sfx = v; },
    setMusic(v) {
      settings.music = v;
      v ? startMusic() : stopMusic();
    }
  };
})();

// ============================================================
// SAVE / SETTINGS SYSTEM
// ============================================================
const Save = (() => {
  const KEY = 'cybervoid_save_v2';
  const defaults = {
    bestScore: 0,
    bestWave: 0,
    totalKills: 0,
    achievements: {},
    settings: { sfx: true, music: true, shake: true, particles: true, volume: 70 }
  };

  let data = { ...defaults };

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) data = { ...defaults, ...JSON.parse(raw) };
    } catch(e) { data = { ...defaults }; }
    return data;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e) {}
  }

  function update(fn) {
    fn(data);
    save();
  }

  return { load, save, update, get: () => data };
})();

// ============================================================
// UTILITY FUNCTIONS
// ============================================================
const Util = {
  rand: (min, max) => Math.random() * (max - min) + min,
  randInt: (min, max) => Math.floor(Math.random() * (max - min + 1)) + min,
  randFrom: arr => arr[Math.floor(Math.random() * arr.length)],
  lerp: (a, b, t) => a + (b - a) * t,
  clamp: (v, min, max) => Math.max(min, Math.min(max, v)),
  dist: (a, b) => Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2),
  angle: (a, b) => Math.atan2(b.y - a.y, b.x - a.x),
  vecFromAngle: (a, speed = 1) => ({ x: Math.cos(a) * speed, y: Math.sin(a) * speed }),
  formatNum: n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : n.toString(),
  hsl: (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
  easeOutBack: t => { const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); },
  easeOutElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2,-10*t)*Math.sin((t*10-0.75)*(2*Math.PI)/3)+1,
};

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx2 = canvas.getContext('2d');
const miniCanvas = document.getElementById('minimapCanvas');
const miniCtx = miniCanvas.getContext('2d');

// ============================================================
// GAME STATE
// ============================================================
const G = {
  // Core
  running: false,
  paused: false,
  dt: 0,
  lastTime: 0,

  animId: null,

  collectibles: [],

  // Player stats

  comboTimer: 0,
  comboMax: 0,

  // Upgrades
  upgrades: {},

  // Skills
  skills: [],
  skillCooldowns: [0, 0, 0],

  // Settings
  settings: { sfx: true, music: true, shake: true, particles: true, volume: 0.7 },

function createPlayer() {

// ============================================================
// UPGRADE DEFINITIONS
// ============================================================

// ============================================================
// ENTITY CREATION HELPERS
// ============================================================
function createBullet(x, y, angle, speed, damage, isPlayer, color = null) {
  return {
    x, y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    damage,
    r: isPlayer ? 5 : 4,
    isPlayer,
    color: color || (isPlayer ? '#00f5ff' : '#ff0040'),
    life: 1.5,
    pierce: isPlayer ? G.player.pierce : 0,
    hitsLeft: isPlayer ? (G.player.pierce + 1) : 1,
    angle,
    speed,
  };
}

function createEnemy(type = 'basic') {
  const side = Util.randInt(0, 3);
  const margin = 50;
  const player = G.player;
  let x, y;

  // Spawn off-screen relative to player camera
  const cx = Util.clamp(player.x, G.W/2, G.worldW - G.W/2);
  const cy = Util.clamp(player.y, G.H/2, G.worldH - G.H/2);

  if (side === 0) { x = cx + Util.rand(-G.W/2 - margin, G.W/2 + margin); y = cy - G.H/2 - margin; }
  else if (side === 1) { x = cx + G.W/2 + margin; y = cy + Util.rand(-G.H/2, G.H/2); }
  else if (side === 2) { x = cx + Util.rand(-G.W/2 - margin, G.W/2 + margin); y = cy + G.H/2 + margin; }
  else { x = cx - G.W/2 - margin; y = cy + Util.rand(-G.H/2, G.H/2); }

  x = Util.clamp(x, 50, G.worldW - 50);
  y = Util.clamp(y, 50, G.worldH - 50);

  const waveMult = 1 + (G.wave - 1) * 0.12;
  const waveHpMult = 1 + (G.wave - 1) * 0.15;

  const types = {
    basic: { r: 14, hp: 40, speed: 90, damage: 10, color: '#ff2060', xp: 8, score: 50, shoot: false },
    fast: { r: 10, hp: 25, speed: 160, damage: 8, color: '#ff8800', xp: 10, score: 80, shoot: false },
    heavy: { r: 22, hp: 180, speed: 55, damage: 18, color: '#8800ff', xp: 25, score: 200, shoot: true, shootRate: 2.5 },
    sniper: { r: 12, hp: 50, speed: 70, damage: 22, color: '#ff00ff', xp: 18, score: 150, shoot: true, shootRate: 3 },
    swarm: { r: 8, hp: 15, speed: 130, damage: 6, color: '#ff4400', xp: 5, score: 30, shoot: false },
    elite: { r: 18, hp: 120, speed: 100, damage: 16, color: '#cc00ff', xp: 35, score: 300, shoot: true, shootRate: 1.8 },
  };

  const t = types[type] || types.basic;

  return {
    x, y,
    vx: 0, vy: 0,
    r: t.r,
    hp: t.hp * waveHpMult,
    maxHp: t.hp * waveHpMult,
    speed: t.speed * (1 + (G.wave - 1) * 0.05),
    damage: t.damage * waveMult,
    color: t.color,
    xp: t.xp,
    score: t.score,
    type,
    shoot: t.shoot || false,
    shootTimer: Math.random() * (t.shootRate || 2),
    shootRate: t.shootRate || 2,
    // AI state
    aiState: 'chase',
    aiTimer: 0,
    angle: 0,
    // Visual
    glowIntensity: 0,
    flashTimer: 0,
    // Status effects
    stunned: 0,
    burned: 0,
    slowed: 0,
    dead: false,
    deathTimer: 0,
  };
}

// ============================================================
// BOSS CREATION
// ============================================================
function createBoss() {
  const phase = Math.floor(G.wave / 5);
  const hpScale = 1 + phase * 0.5;
  const dmgScale = 1 + phase * 0.3;

  return {
    x: G.worldW / 2,
    y: G.worldH / 2 - 400,
    vx: 0, vy: 0,
    r: 40 + phase * 5,
    hp: (800 + phase * 400) * hpScale,
    maxHp: (800 + phase * 400) * hpScale,
    damage: (25 + phase * 8) * dmgScale,
    speed: 70 + phase * 10,
    color: '#ff0040',
    phase,
    angle: 0,
    rotSpeed: 0.8,
    shootTimer: 0,
    shootRate: 1.2 - phase * 0.1,
    pattern: 0,
    patternTimer: 0,
    patternDuration: 4,
    enraged: false,
    enrageTimer: 0,
    dead: false,
    flashTimer: 0,
    haloAngle: 0,
    // Arms/parts
    armAngles: [0, Math.PI * 0.5, Math.PI, Math.PI * 1.5],
    tentacles: Array.from({length: 6}, (_, i) => ({
      angle: (i / 6) * Math.PI * 2,
      length: 60 + phase * 10,
      wave: 0,
    })),
    xp: 500 + phase * 200,
    score: 5000 + phase * 2000,
  };
}

// ============================================================
// PARTICLE SYSTEM
// ============================================================
function spawnParticle(x, y, opts = {}) {
  if (!G.settings.particles) return;
  const angle = opts.angle !== undefined ? opts.angle : Math.random() * Math.PI * 2;
  const speed = opts.speed !== undefined ? opts.speed : Util.rand(50, 200);
  G.particles.push({
    x, y,
    vx: Math.cos(angle) * speed * (opts.speedMult || 1),
    vy: Math.sin(angle) * speed * (opts.speedMult || 1),
    r: opts.r || Util.rand(2, 6),
    color: opts.color || '#00f5ff',
    life: opts.life || 1,
    maxLife: opts.life || 1,
    gravity: opts.gravity || 0,
    fade: opts.fade !== false,
    shrink: opts.shrink !== false,
    glow: opts.glow !== false,
  });
}

function spawnExplosion(x, y, size, color, count = 15) {
  if (!G.settings.particles) count = Math.floor(count * 0.3);
  for (let i = 0; i < count; i++) {
    spawnParticle(x, y, {
      speed: Util.rand(size * 0.5, size * 2),
      r: Util.rand(2, size * 0.15),
      color,
      life: Util.rand(0.4, 0.9),
      gravity: 20,
    });
  }
  // Screen flash
  G.screenFlashAlpha = Math.min(G.screenFlashAlpha + 0.15, 0.5);
  G.screenFlashColor = `rgba(${color.startsWith('#') ? hexToRgb(color) : '0,245,255'},`;
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function spawnDamageNumber(x, y, dmg, isCrit) {
  G.damageNumbers.push({
    x, y,
    vy: -60,
    text: isCrit ? '💥' + Math.round(dmg) : Math.round(dmg),
    life: 1.2,
    maxLife: 1.2,
    color: isCrit ? '#ffcc00' : '#ff8888',
    size: isCrit ? 22 : 16,
    isCrit,
  });
}

function spawnCollectible(x, y, type) {
  G.collectibles.push({
    x, y,
    type, // 'xp', 'hp', 'score'
    r: 8,
    vx: Util.rand(-60, 60),
    vy: Util.rand(-60, 60),
    life: 15,
    pulse: 0,
    collected: false,
  });
}

// ============================================================
// SCREEN SHAKE
// ============================================================
function screenShake(power, duration) {
  if (!G.settings.shake) return;
  G.camShakePower = Math.max(G.camShakePower, power);
}

// ============================================================
// DAMAGE DEALING
// ============================================================
function dealDamage(enemy, dmg, isCrit, srcX, srcY) {
  if (enemy.dead) return;
  enemy.hp -= dmg;
  enemy.flashTimer = 0.15;
  G.totalDamageDealt += dmg;
  spawnDamageNumber(enemy.x + Util.rand(-15,15), enemy.y - enemy.r - 5, dmg, isCrit);

  if (isCrit) {
    G.critCount++;
    spawnParticle(enemy.x, enemy.y, { color: '#ffcc00', r: 8, speed: 100, life: 0.4 });
    screenShake(5, 0.15);
  }

  // Chain lightning
  if (G.player.chainLightning && !enemy.chained) {
    let chainTargets = 0;
    [...G.enemies, G.boss].filter(Boolean).forEach(e => {
      if (e !== enemy && !e.dead && Util.dist(e, enemy) < 150 && chainTargets < 3) {
        chainTargets++;
        e.chained = true;
        setTimeout(() => { if(e) e.chained = false; }, 100);
        dealDamage(e, dmg * 0.5, false, enemy.x, enemy.y);
        // Visual lightning arc
        spawnParticle(enemy.x, enemy.y, { color: '#00ffcc', r: 3, speed: 20, life: 0.2 });
      }
    });
  }

  // Explosive bullets
  if (G.player.explosiveBullets) {
    spawnExplosion(enemy.x, enemy.y, 40, enemy.color, 8);
    G.enemies.forEach(e => {
      if (e !== enemy && !e.dead && Util.dist(e, enemy) < 50) {
        dealDamage(e, dmg * 0.3, false, enemy.x, enemy.y);
      }
    });
  }

  if (enemy.hp <= 0) killEnemy(enemy);
}

function dealPlayerDamage(amount) {
  if (G.player.invincible > 0) return;

  // Dodge check
  if (Math.random() < G.player.dodgeChance) {
    showToast('DODGE!');
    return;
  }

  // Shield absorbs first
  if (G.player.shield > 0) {
    const absorbed = Math.min(G.player.shield, amount);
    G.player.shield -= absorbed;
    amount -= absorbed;
    Audio.sounds.shield();
  }

  const finalDmg = Math.max(1, amount - G.player.armor);
  G.player.hp -= finalDmg;
  G.player.invincible = G.player.invincibleMax;

  // Flash UI
  const df = document.getElementById('damageFlash');
  df.classList.add('flash');
  setTimeout(() => df.classList.remove('flash'), 150);

  Audio.sounds.playerHit();
  screenShake(10, 0.3);

  // Screen chromatic aberration effect
  triggerGlitch(0.2);

  if (G.player.hp <= 0) {
    G.player.hp = 0;
    endGame();
  }

  // Reset combo
  G.combo = 0;
  updateHUD();
}

function killEnemy(enemy) {
  if (enemy.dead) return;
  enemy.dead = true;
  G.sessionKills++;
  G.kills++;
  G.waveEnemiesKilled++;

  // Scoring with combo multiplier
  const comboMult = 1 + Math.floor(G.combo / 10) * 0.5;
  const pts = Math.round(enemy.score * G.player.scoreBonus * comboMult);
  G.score += pts;

  // Combo
  G.combo++;
  G.comboMax = Math.max(G.comboMax, G.combo);
  G.comboTimer = 3;

  // EXP
  const xpGain = Math.round(enemy.xp * G.player.expMult);
  gainExp(xpGain);

  // Drop collectibles
  if (Math.random() < 0.6) spawnCollectible(enemy.x, enemy.y, 'xp');
  if (Math.random() < 0.15) spawnCollectible(enemy.x, enemy.y, 'hp');

  // Death FX
  spawnExplosion(enemy.x, enemy.y, enemy.r * 3, enemy.color, 20);
  Audio.sounds.enemyDie();

  // Aura damage
  if (G.player.aura) {
    // Kill grants damage aura burst
    for (let i = 0; i < 8; i++) {
      G.bullets.push(createBullet(
        G.player.x, G.player.y,
        (i / 8) * Math.PI * 2,
        G.player.bulletSpeed * 0.6,
        G.player.damage * 0.4,
        true, '#00ff88'
      ));
    }
  }

  checkAchievements();
  updateHUD();
}

function killBoss(boss) {
  if (boss.dead) return;
  boss.dead = true;
  G.bossKilled = true;
  G.bossActive = false;
  G.bossEnding = true;
  G.boss = null;

  const pts = Math.round(boss.score * G.player.scoreBonus);
  G.score += pts;
  gainExp(boss.xp);

  spawnExplosion(boss.x, boss.y, 200, '#ff0040', 80);
  spawnExplosion(boss.x + 50, boss.y - 30, 120, '#ff8800', 50);
  spawnExplosion(boss.x - 60, boss.y + 40, 100, '#ff00ff', 40);

  Audio.sounds.bossDie();
  screenShake(25, 1);

  // Show cinematic
  hideCinematicBars();
  showToast('🏆 BOSS DEFEATED! +' + Util.formatNum(pts) + ' PTS');

  // Drop lots of XP
  for (let i = 0; i < 10; i++) {
    spawnCollectible(boss.x + Util.rand(-80,80), boss.y + Util.rand(-80,80), 'xp');
  }

  checkAchievements();

  // Next wave
  setTimeout(() => {
    G.bossEnding = false;
    G.wave++;
    startWave();
  }, 2000);
}

// ============================================================
// EXP & LEVEL SYSTEM
// ============================================================
function gainExp(amount) {
  G.exp += amount;
  while (G.exp >= G.expNeeded) {
    G.exp -= G.expNeeded;
    levelUp();
  }
  updateHUD();
}

function levelUp() {
  G.level++;
  G.expNeeded = Math.round(G.expNeeded * 1.3);
  Audio.sounds.levelUp();
  screenShake(8, 0.4);

  // Slowmo effect
  G.timeScale = 0.2;
  setTimeout(() => { G.timeScale = 1; }, 500);

  showLevelUpScreen();
}

function showLevelUpScreen() {
  G.paused = true;
  const overlay = document.getElementById('levelUpOverlay');
  const cards = document.getElementById('levelupCards');
  cards.innerHTML = '';

  // Pick 3 random upgrades (weighted by rarity)
  const available = UPGRADES.filter(u => !G.upgrades[u.id + '_locked']);
  const pool = [];
  available.forEach(u => {
    const weight = [4, 2, 1, 0.4][u.rarity];
    for (let i = 0; i < Math.ceil(weight * 10); i++) pool.push(u);
  });

  const chosen = [];
  while (chosen.length < 3 && pool.length > 0) {
    const idx = Util.randInt(0, pool.length - 1);
    const up = pool[idx];
    if (!chosen.find(c => c.id === up.id)) chosen.push(up);
    pool.splice(idx, 1);
  }

  const rarityNames = ['COMMON', 'RARE', 'EPIC', 'LEGENDARY'];
  const rarityClasses = ['rarity-common', 'rarity-rare', 'rarity-epic', 'rarity-legendary'];

  chosen.forEach(up => {
    const card = document.createElement('div');
    card.className = 'upgrade-card';
    card.innerHTML = `
      <span class="upgrade-icon">${up.icon}</span>
      <div class="upgrade-name">${up.name}</div>
      <div class="upgrade-desc">${up.desc}</div>
      <div class="upgrade-rarity ${rarityClasses[up.rarity]}">${rarityNames[up.rarity]}</div>
    `;

    // Legendary glow
    if (up.rarity === 3) {
      card.style.borderColor = 'rgba(255,204,0,0.6)';
      card.style.boxShadow = '0 0 20px rgba(255,204,0,0.2)';
    } else if (up.rarity === 2) {
      card.style.borderColor = 'rgba(191,0,255,0.5)';
    }

    card.addEventListener('click', () => {
      Audio.sounds.upgrade();
      up.apply(G.player);
      G.upgrades[up.id] = (G.upgrades[up.id] || 0) + 1;
      overlay.classList.remove('active');
      G.paused = false;
      updateSkillSlotUI();
    });

    card.addEventListener('touchstart', (e) => {
      e.preventDefault();
      card.click();
    }, { passive: false });

    cards.appendChild(card);
  });

  overlay.classList.add('active');
}

// ============================================================
// WAVE SYSTEM
// ============================================================
function startWave() {
  G.waveEnemiesKilled = 0;
  G.enemies = [];
  G.enemyBullets = [];

  const isBossWave = G.wave % 5 === 0;

  if (isBossWave) {
    showBossWarning();
    G.bossActive = true;
    G.boss = createBoss();
    G.waveEnemiesTotal = 1;
    document.getElementById('waveDisplay').textContent = `⚠ BOSS WAVE ${G.wave} ⚠`;
  } else {
    const baseCount = 8 + G.wave * 3;
    G.waveEnemiesTotal = baseCount;
    document.getElementById('waveDisplay').textContent = `WAVE ${G.wave}`;

    // Determine enemy types available
    const types = ['basic'];
    if (G.wave >= 2) types.push('fast');
    if (G.wave >= 3) types.push('heavy');
    if (G.wave >= 4) types.push('sniper');
    if (G.wave >= 6) types.push('swarm', 'swarm');
    if (G.wave >= 8) types.push('elite');

    // Spawn enemies gradually
    let spawned = 0;
    const spawnInterval = setInterval(() => {
      if (!G.running || spawned >= baseCount) {
        clearInterval(spawnInterval);
        return;
      }
      const type = Util.randFrom(types);
      G.enemies.push(createEnemy(type));
      spawned++;
    }, Math.max(200, 800 - G.wave * 30));
  }

  showToast(`⚡ WAVE ${G.wave} ${isBossWave ? '- BOSS!' : 'INCOMING!'}`);
  updateHUD();
}

function showBossWarning() {
  Audio.sounds.bossWarn();
  screenShake(15, 1);
  triggerGlitch(1.5);

  const warn = document.getElementById('bossWarning');
  warn.style.display = 'block';
  showCinematicBars();

  setTimeout(() => {
    warn.style.display = 'none';
    hideCinematicBars();
  }, 2500);
}

function showCinematicBars() {
  document.getElementById('cbarTop').style.height = '60px';
  document.getElementById('cbarBottom').style.height = '60px';
}

function hideCinematicBars() {
  document.getElementById('cbarTop').style.height = '0';
  document.getElementById('cbarBottom').style.height = '0';
}

// ============================================================
// GLITCH EFFECT
// ============================================================
let glitchTimeout = null;
function triggerGlitch(duration) {
  const gl = document.getElementById('glitchOverlay');
  gl.style.opacity = '1';
  gl.style.background = 'repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,0,64,0.03) 2px, rgba(255,0,64,0.03) 4px)';

  clearTimeout(glitchTimeout);
  glitchTimeout = setTimeout(() => {
    gl.style.opacity = '0';
  }, duration * 1000);
}

// ============================================================
function showToast(msg) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 2600);
}
